[package]
name = "nazo-audit-anchor-receiver"
version = "0.1.0"
edition = "2021"
description = "Reference audit-anchor receiver for benchmark and failure-injection runs"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
ed25519-dalek = "3.0.0"
hmac = "0.13.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1.27.0", features = ["serde", "v4"] }

[workspace]
