[package]
name = "nazo-audit-anchor-receiver"
version = "0.1.0"
edition = "2021"
rust-version = "1.100.0"
description = "Reference audit-anchor receiver for benchmark and failure-injection runs"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
jiff = { version = "1.0.1", default-features = false, features = ["std", "serde"] }
ed25519-dalek = "3.0.0"
hmac = "0.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring", "webpki-roots"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1.29.3", features = ["serde", "v4"] }

[workspace]

[lints.cargo]
unused_dependencies = "warn"
