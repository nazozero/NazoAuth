[package]
name = "oauth-goose"
version = "0.1.0"
edition = "2024"

[dependencies]
goose = { version = "=0.19.2", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[workspace]
