{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "this Deployment supports one persistent instance; HA requires separately owned instance identities and storage" }}
{{- end }}
{{- if not .Values.persistence.enabled }}
{{- fail "persistence.enabled is required for instance identity and generated secrets" }}
{{- end }}
{{- $probeHost := required "publicBaseUrl must include a host" ((urlParse .Values.publicBaseUrl).host) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nazoauth.fullname" . }}
  labels:
    {{- include "nazoauth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nazoauth.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nazoauth.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nazoauth
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["nazoauth", "server"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SIGNING_KEY_ENCRYPTION_KEY_FILE
              value: /run/nazoauth-signing-root/key
            - name: SIGNING_KEY_ENCRYPTION_KEY_ID
              value: {{ required "signing.wrappingKeyId is required" .Values.signing.wrappingKeyId | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "connections.existingSecret is required" .Values.connections.existingSecret }}
                  key: {{ .Values.connections.databaseUrlKey }}
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "connections.existingSecret is required" .Values.connections.existingSecret }}
                  key: {{ .Values.connections.valkeyUrlKey }}
            {{- if .Values.appSecrets.existingSecret }}
            - name: CLIENT_SECRET_PEPPER_FILE
              value: /run/nazoauth-app-secrets/client-secret-pepper
            - name: PAIRWISE_SUBJECT_SECRET_FILE
              value: /run/nazoauth-app-secrets/pairwise-subject-secret
            - name: DYNAMIC_CLIENT_REGISTRATION_INITIAL_ACCESS_TOKEN_FILE
              value: /run/nazoauth-app-secrets/dynamic-registration-initial-access-token
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: signing-root
              mountPath: /run/nazoauth-signing-root
              readOnly: true
            - name: config
              mountPath: /app/.env.yaml
              subPath: .env.yaml
              readOnly: true
            {{- if .Values.appSecrets.existingSecret }}
            - name: app-secrets
              mountPath: /run/nazoauth-app-secrets
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /var/lib/nazoauth
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /startup
              port: http
              httpHeaders:
                - name: Host
                  value: {{ $probeHost | quote }}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ $probeHost | quote }}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
              httpHeaders:
                - name: Host
                  value: {{ $probeHost | quote }}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: signing-root
          secret:
            secretName: {{ required "signing.existingSecret is required" .Values.signing.existingSecret }}
            items:
              - key: {{ .Values.signing.wrappingKeySecretKey }}
                path: key
        - name: config
          configMap:
            name: {{ include "nazoauth.fullname" . }}
        {{- if .Values.appSecrets.existingSecret }}
        - name: app-secrets
          secret:
            secretName: {{ .Values.appSecrets.existingSecret }}
            items:
              - key: {{ .Values.appSecrets.clientSecretPepperKey }}
                path: client-secret-pepper
              - key: {{ .Values.appSecrets.pairwiseSubjectSecretKey }}
                path: pairwise-subject-secret
              - key: {{ .Values.appSecrets.dynamicRegistrationTokenKey }}
                path: dynamic-registration-initial-access-token
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "nazoauth.fullname" . }}-data
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
