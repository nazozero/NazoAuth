[package]
edition = "2021"
rust-version = "1.81"
name = "mdoc-rs"
version = "0.2.0"
build = false
exclude = ["examples/"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "ISO/IEC 18013-5 mobile document (mdoc) library — parsing, verification, selective disclosure, and issuance"
homepage = "https://github.com/kushaldas/mdoc-rs"
readme = "README.md"
keywords = [
    "mdoc",
    "mdl",
    "iso18013",
    "eudiw",
    "cbor",
]
categories = [
    "cryptography",
    "authentication",
]
license = "BSD-2-Clause"
repository = "https://github.com/kushaldas/mdoc-rs"

[features]
blocking = ["dep:tokio"]
debug = []
default = [
    "tsp",
    "issue",
    "blocking",
]
engagement = ["dep:aes-gcm"]
issue = []
pkcs11-example = [
    "dep:cryptoki",
    "issue",
]
status = [
    "dep:reqwest",
    "dep:tokio",
]
tsp = [
    "dep:tsp-ltv",
    "tsp-ltv?/tsp",
]

[lib]
name = "mdoc_rs"
path = "src/lib.rs"

[[test]]
name = "interop_test"
path = "tests/interop_test.rs"

[[test]]
name = "roundtrip_test"
path = "tests/roundtrip_test.rs"

[[test]]
name = "session_test"
path = "tests/session_test.rs"

[[test]]
name = "verifier_test"
path = "tests/verifier_test.rs"

[dependencies.aes-gcm]
version = "0.10"
optional = true

[dependencies.base64]
version = "0.22"

[dependencies.chrono]
version = "0.4"
features = [
    "std",
    "clock",
]
default-features = false

[dependencies.ciborium]
version = "0.2"

[dependencies.const-oid]
version = "0.9"
features = ["db"]

[dependencies.coset]
version = "0.4.2"

[dependencies.cryptoki]
version = "0.12"
optional = true

[dependencies.der]
version = "0.7"
features = ["alloc"]

[dependencies.digest]
version = "0.10"

[dependencies.ecdsa]
version = "0.17"
features = [
    "algorithm",
    "der",
]

[dependencies.ed25519-dalek]
version = "2"
features = ["pem"]

[dependencies.hkdf]
version = "0.12"

[dependencies.hmac]
version = "0.12"

[dependencies.log]
version = "0.4"

[dependencies.p256]
version = "0.14"
features = [
    "ecdh",
    "ecdsa",
]

[dependencies.p384]
version = "0.14"
features = [
    "ecdh",
    "ecdsa",
]

[dependencies.p521]
version = "0.14"
features = ["ecdsa"]

[dependencies.rand]
version = "0.8"

[dependencies.reqwest]
version = "0.12"
features = [
    "rustls-tls",
    "json",
]
optional = true
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.signature]
version = "3"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = [
    "rt",
    "macros",
]
optional = true

[dependencies.tsp-ltv]
version = "0.2"
optional = true
default-features = false

[dependencies.x509-cert]
version = "0.2"
features = ["pem"]

[dev-dependencies.hex]
version = "0.4"

[dev-dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "macros",
]
