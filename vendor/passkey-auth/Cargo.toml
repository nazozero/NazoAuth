[package]
edition = "2024"
rust-version = "1.85"
name = "passkey-auth"
version = "0.1.3"
authors = ["Sriram <marirs@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure-Rust WebAuthn server library focused on passkeys (no openssl)."
readme = "README.md"
keywords = [
    "webauthn",
    "passkey",
    "fido2",
    "authentication",
]
categories = [
    "authentication",
    "cryptography",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/marirs/passkey-auth-rs"

[lib]
name = "passkey_auth"
path = "src/lib.rs"

[[example]]
name = "axum_passwordless"
path = "examples/axum_passwordless.rs"

[[example]]
name = "axum_server"
path = "examples/axum_server.rs"

[[example]]
name = "axum_sqlite"
path = "examples/axum_sqlite.rs"

[[example]]
name = "rocket_credential_manager"
path = "examples/rocket_credential_manager.rs"

[[example]]
name = "rocket_server"
path = "examples/rocket_server.rs"

[[test]]
name = "attestation_e2e"
path = "tests/attestation_e2e.rs"

[[test]]
name = "ceremony_e2e"
path = "tests/ceremony_e2e.rs"

[dependencies.base64]
version = "0.22"

[dependencies.ciborium]
version = "0.2"

[dependencies.const-oid]
version = "0.9"

[dependencies.ed25519-dalek]
version = "2"
features = ["pkcs8"]

[dependencies.p256]
version = "0.14"
features = ["ecdsa"]

[dependencies.rand]
version = "0.8"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.thiserror]
version = "2"

[dependencies.url]
version = "2"

[dependencies.x509-cert]
version = "0.2"
features = ["std"]

[dev-dependencies.axum]
version = "0.7"

[dev-dependencies.base64]
version = "0.22"

[dev-dependencies.ciborium]
version = "0.2"

[dev-dependencies.ed25519-dalek]
version = "2"
features = [
    "pkcs8",
    "rand_core",
]

[dev-dependencies.hex]
version = "0.4"

[dev-dependencies.p256]
version = "0.14"
features = [
    "ecdsa",
    "pkcs8",
    "pem",
]

[dev-dependencies.rand]
version = "0.8"

[dev-dependencies.rocket]
version = "0.5"
features = ["json"]

[dev-dependencies.rusqlite]
version = "0.32"
features = ["bundled"]

[dev-dependencies.sha2]
version = "0.10"
features = ["oid"]

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
    "sync",
]

[dev-dependencies.tower-http]
version = "0.6"
features = [
    "fs",
    "cors",
]

[dev-dependencies.x509-cert-test]
package = "x509-cert"
version = "0.3"
features = [
    "builder",
    "std",
]


[dev-dependencies.sha2-new]
package = "sha2"
version = "0.11"
features = ["oid"]
