<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>passkey-auth demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.4rem; }
    button { font-size: 1rem; padding: 0.6rem 1rem; margin-right: 0.5rem; cursor: pointer; }
    pre { background: #f4f4f4; padding: 0.8rem; border-radius: 4px; overflow-x: auto; font-size: 0.85rem; }
    .ok  { color: #060; }
    .err { color: #a00; }
  </style>
</head>
<body>
  <h1>passkey-auth demo</h1>
  <p>
    Single hard-coded user (<code>alice@example.com</code>). Click
    <b>Register</b> first to create a passkey, then <b>Authenticate</b>
    to verify it. Works with Touch ID, Windows Hello, Android
    biometrics, iCloud Keychain, Yubikey - anything the browser
    surfaces as a passkey.
  </p>

  <p>
    <button id="register">Register a passkey</button>
    <button id="authenticate">Authenticate</button>
  </p>

  <pre id="log"></pre>

  <script>
  // ---------- base64 helpers (browser ArrayBuffer <-> base64url) ----------
  function b64urlEncode(buf) {
    let s = btoa(String.fromCharCode(...new Uint8Array(buf)));
    return s.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64urlDecode(str) {
    // pad and swap alphabet
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    const bin = atob(str);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out.buffer;
  }

  const logEl = document.getElementById("log");
  function log(msg, cls) {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
  }

  // ---------- Register flow -------------------------------------------------
  document.getElementById("register").addEventListener("click", async () => {
    try {
      log("→ POST /register/start");
      const startResp = await fetch("/register/start", { method: "POST" });
      if (!startResp.ok) throw new Error(await startResp.text());
      const opts = await startResp.json();

      // The server gave us base64url-encoded byte fields; the WebAuthn
      // API wants ArrayBuffers, so decode them.
      opts.challenge = b64urlDecode(opts.challenge);
      opts.user.id = b64urlDecode(opts.user.id);
      if (opts.excludeCredentials) {
        opts.excludeCredentials = opts.excludeCredentials.map(c => ({
          ...c, id: b64urlDecode(c.id),
        }));
      }

      log("→ navigator.credentials.create(...)");
      const cred = await navigator.credentials.create({ publicKey: opts });

      // Re-encode for the wire. The server accepts either url-safe or
      // standard base64 (passkey-auth is permissive), but url-safe is
      // the spec-correct form.
      const body = {
        id: cred.id,
        attestationObject: b64urlEncode(cred.response.attestationObject),
        clientDataJSON: b64urlEncode(cred.response.clientDataJSON),
        transports: cred.response.getTransports ? cred.response.getTransports() : [],
      };

      log("→ POST /register/finish");
      const finishResp = await fetch("/register/finish", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!finishResp.ok) throw new Error(await finishResp.text());
      const result = await finishResp.json();
      log(`✓ registered (credential ${result.credential_id})`, "ok");
    } catch (e) {
      log(`✗ ${e.message || e}`, "err");
    }
  });

  // ---------- Authenticate flow --------------------------------------------
  document.getElementById("authenticate").addEventListener("click", async () => {
    try {
      log("→ POST /authenticate/start");
      const startResp = await fetch("/authenticate/start", { method: "POST" });
      if (!startResp.ok) throw new Error(await startResp.text());
      const opts = await startResp.json();

      opts.challenge = b64urlDecode(opts.challenge);
      if (opts.allowCredentials) {
        opts.allowCredentials = opts.allowCredentials.map(c => ({
          ...c, id: b64urlDecode(c.id),
        }));
      }

      log("→ navigator.credentials.get(...)");
      const assertion = await navigator.credentials.get({ publicKey: opts });

      const body = {
        id: assertion.id,
        authenticatorData: b64urlEncode(assertion.response.authenticatorData),
        signature: b64urlEncode(assertion.response.signature),
        clientDataJSON: b64urlEncode(assertion.response.clientDataJSON),
        userHandle: assertion.response.userHandle
          ? b64urlEncode(assertion.response.userHandle)
          : null,
      };

      log("→ POST /authenticate/finish");
      const finishResp = await fetch("/authenticate/finish", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!finishResp.ok) throw new Error(await finishResp.text());
      const result = await finishResp.json();
      log(`✓ authenticated (UV=${result.user_verified}, counter=${result.new_counter})`, "ok");
    } catch (e) {
      log(`✗ ${e.message || e}`, "err");
    }
  });
  </script>
</body>
</html>
