[advisories]
version = 2
yanked = "deny"

[[advisories.ignore]]
id = "RUSTSEC-2026-0543"
allow = ["worker@0.9.0"]
expiry = "2026-12-19"
reason = "Informational unmaintained notice: the latest official SDK, worker 0.9.0, requires chrono unconditionally and no patched chrono version exists. Remove when the SDK drops chrono."

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "AGPL-3.0-or-later",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "PostgreSQL",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
