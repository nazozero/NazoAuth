[workspace]
members = [
    "crates/authorization-server-core",
    "crates/digital-credentials",
    "crates/key-management",
    "crates/openid4vci",
    "crates/openid4vp",
    "crates/persistence",
    "crates/persistence-postgres",
    "crates/authorization-server",
    "crates/authorization-server-postgres",
    "crates/authorization-server-valkey",
    "crates/authorization-server-object-store",
    "crates/nazoauth",
    "crates/server",
    "crates/operator-protocol",
    "crates/http-signatures",
    "crates/http-actix",
    "crates/identity",
    "crates/runtime-capabilities",
    "crates/resource-server",
    "crates/scim-events",
    "crates/state-store-valkey",
    "crates/crypto",
]
default-members = [
    "crates/server",
]
resolver = "3"
exclude = ["fuzz"]

[workspace.package]
version = "0.3.9"
edition = "2024"
rust-version = "1.100.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nazozero/NazoAuth"

[workspace.dependencies]
bytes = "1.12.1"
cookie = "0.16.2"
mime = "0.3.17"
matchit = "0.9.2"
percent-encoding = "2.3.2"
multer = { version = "3.1.0", default-features = false }
encoding_rs = "0.8.35"
serde_urlencoded = "0.7.1"
nazoauth = { version = "0.3.9", path = "crates/nazoauth" }
hex = "0.4.3"
actix-files = "0.7.4"
# Keep the native listener on HTTP/1.1 while upstream HTTP/2 uses affected h2 0.3.
# Explicit features preserve the other framework capabilities without enabling http2.
actix-web = { version = "4.19.0", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
actix-tls = "3.6.1"
anyhow = "1.0.104"
aes-gcm = "0.11.1"
arc-swap = "1.9.3"
argon2 = "0.6.0"
atomicwrites = "0.4.4"
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = "0.4.45"
der = { version = "0.8.2", features = ["derive"] }
diesel = "2.3.14"
diesel-async = "0.9.2"
diesel_migrations = "2.3.2"
ed25519-dalek = "3.0.0"
fred = "10.1.0"
flate2 = "1.1.10"
fs2 = "0.4.3"
futures-util = "0.3.34"
futures-executor = "0.3.34"
hmac = "0.13.0"
hkdf = "0.13.0"
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
iri-string = { version = "0.7.14", default-features = false }
jsonwebtoken = { version = "12.0.0", default-features = false }
nazo-mdoc = { version = "0.3.0", git = "https://github.com/nazozero/mdoc-rs", rev = "d2f653d262da4c783ca6c430ef1f056f40baa25f", default-features = false }
lru = "0.19.0"
futures-channel = "0.3.34"
coset = "0.4.2"
ciborium = "0.2.2"
lettre = { version = "0.11.23", default-features = false }
nazo-auth = { version = "0.3.9", path = "crates/authorization-server-core" }
nazo-crypto = { version = "0.3.9", path = "crates/crypto", default-features = false }
nazo-digital-credentials = { version = "0.3.9", path = "crates/digital-credentials" }
nazo-http-actix = { version = "0.3.9", path = "crates/http-actix" }
nazo-http-signatures = { version = "0.3.9", path = "crates/http-signatures" }
nazo-identity = { version = "0.3.9", path = "crates/identity" }
nazo-key-management = { version = "0.3.9", path = "crates/key-management" }
nazo-openid4vci = { version = "0.3.9", path = "crates/openid4vci" }
nazo-openid4vp = { version = "0.3.9", path = "crates/openid4vp" }
nazo-oauth-server = { version = "0.3.9", path = "crates/authorization-server" }
nazo-oauth-server-postgres = { version = "0.3.9", path = "crates/authorization-server-postgres" }
nazo-oauth-server-valkey = { version = "0.3.9", path = "crates/authorization-server-valkey" }
nazo-oauth-server-object-store = { version = "0.3.9", path = "crates/authorization-server-object-store" }
nazo-operator-protocol = { version = "0.3.9", path = "crates/operator-protocol" }
nazo-persistence = { version = "0.3.9", path = "crates/persistence" }
nazo-postgres = { version = "0.3.9", path = "crates/persistence-postgres" }
nazo-resource-server = { version = "0.3.9", path = "crates/resource-server" }
nazo-runtime-modules = { version = "0.3.9", path = "crates/runtime-capabilities" }
nazo-scim-events = { version = "0.3.9", path = "crates/scim-events" }
nazo-valkey = { version = "0.3.9", path = "crates/state-store-valkey" }
pem = "4.0.0"
pkcs8 = { version = "0.11.0", features = ["alloc"] }
p256 = "0.14.0"
passkey-auth = { version = "0.2.0", features = ["aws-lc"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["creation-flags", "job-object", "kill-on-drop", "process-group", "tokio1"] }
proptest = "1.12.0"
rand = "0.10.3"
rustix = { version = "1.1.5", features = ["fs", "process"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = "1.15.1"
webpki = { package = "rustls-webpki", version = "0.103.16" }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
sha1 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.53.3"
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["aws-lc-rs", "native-certs", "webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.28.0", features = ["js"] }
wasm-bindgen-test = "0.3.79"
web-time = "1.1.0"
x509-cert = "0.3.0"
x509-parser = "0.18.1"
yasna = "0.6.0"
zeroize = { version = "1.9.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[patch.crates-io]
# Pin the WebAuthn verifier's protocol and credential-persistence contract;
# upgrades must pass the passkey/MFA and attestation regression suites.
passkey-auth = { git = "https://github.com/nazozero/passkey-auth-rs", rev = "84938674306a2ca0b84319e8ee499b61b8f32e84" }

# Direct mTLS shares the immutable peer chain across the TLS/HTTP boundary.
# Retire when upstream provides shared ownership or a measured per-connection copy is acceptable.
rustls = { git = "https://github.com/bymoye/rustls", rev = "f282759e6b6811537566a71b29f25b528735d966" }
