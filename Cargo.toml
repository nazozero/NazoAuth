[workspace]
members = ["crates/*"]
default-members = ["crates/server"]
resolver = "3"
exclude = ["fuzz", "examples/hyper-embedding"]

[workspace.package]
version = "0.4.1"
# The registry checkout enables publication for members that inherit this field.
publish = false
edition = "2024"
rust-version = "1.100.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nazozero/NazoAuth"

[workspace.dependencies]
nazo-auth.path = "crates/authorization-server-core"
nazo-crypto.path = "crates/crypto"
nazo-crypto.default-features = false
nazo-digital-credentials.path = "crates/digital-credentials"
nazo-http-actix.path = "crates/http-actix"
nazo-http-signatures.path = "crates/http-signatures"
nazo-http-worker.path = "crates/http-worker"
nazo-identity.path = "crates/identity"
nazo-key-management.path = "crates/key-management"
nazo-oauth-server.path = "crates/authorization-server"
nazo-oauth-server-d1.path = "crates/authorization-server-d1"
nazo-oauth-server-object-store.path = "crates/authorization-server-object-store"
nazo-oauth-server-postgres.path = "crates/authorization-server-postgres"
nazo-oauth-server-valkey.path = "crates/authorization-server-valkey"
nazo-openid4vci.path = "crates/openid4vci"
nazo-openid4vp.path = "crates/openid4vp"
nazo-operator-protocol.path = "crates/operator-protocol"
nazo-persistence.path = "crates/persistence"
nazo-postgres.path = "crates/persistence-postgres"
nazo-resource-server.path = "crates/resource-server"
nazo-runtime-modules.path = "crates/runtime-capabilities"
nazo-scim-events.path = "crates/scim-events"
nazo-valkey.path = "crates/state-store-valkey"
nazoauth.path = "crates/nazoauth"
nazoauth.default-features = false

actix-files = "0.7.5"
actix-tls = "3.6.1"
# Keep the native listener on HTTP/1.1 while upstream HTTP/2 uses affected h2 0.3.
# Cookies are handled by the HTTP facade; the listener does not need Actix's cookie API.
actix-web = { version = "4.20.0", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "unicode", "compat", "ws"] }
aes-gcm = "0.11.1"
anyhow = "1.0.104"
arc-swap = "1.9.5"
password-hash = { version = "0.6.1", features = ["phc", "getrandom"] }
atomicwrites = "0.4.4"
aws-lc-rs = "1.19.0"
base64 = "0.23.1"
blake3 = "1.8.7"
bytes = "1.12.2"
ciborium = "0.2.2"
cookie = "0.18.3"
coset = "0.4.2"
der = { version = "0.8.3", features = ["derive"] }
diesel = "2.4.0"
diesel-async = "0.10.0"
diesel_migrations = "2.4.0"
ed25519-dalek = "3.0.0"
encoding_rs = "0.8.44"
flate2 = "1.1.11"
fred = "10.1.0"
futures-channel = "0.3.34"
futures-executor = "0.3.34"
futures-util = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
http = "1.5.0"
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = { version = "1.0.2", default-features = false, features = ["std", "serde", "js"] }
jiff-diesel = { version = "1.0.0", features = ["postgres"] }
jsonwebtoken = { version = "12.0.0", default-features = false }
lettre = { version = "0.11.24", default-features = false }
lru = "0.19.1"
matchit = "0.9.2"
mime = "0.3.18"
ml-dsa = { version = "0.1.2", default-features = false, features = ["alloc"] }
multer = { version = "3.1.0", default-features = false }
nazo-mdoc = { version = "0.4.0", default-features = false, features = ["certificate-profile"] }
nazo-passkey = { version = "0.3.0", features = ["aws-lc"] }
p256 = "0.14.0"
p384 = { version = "0.14.0", features = ["ecdsa"] }
p521 = { version = "0.14.0", features = ["ecdsa"] }
pem = "4.0.0"
pkcs8 = { version = "0.11.0", features = ["alloc"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["creation-flags", "job-object", "kill-on-drop", "process-group", "tokio1"] }
proptest = "1.12.0"
rand = "0.10.4"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rsa = { version = "0.10.0", features = ["pkcs1v15", "encoding"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = "1.16.0"
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.54.1"
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["aws-lc-rs", "native-certs", "webpki-roots"] }
tracing = "0.1.44"
url = "2.5.9"
urlencoding = "2.1.3"
uuid = { version = "1.29.3", features = ["js"] }
wasm-bindgen-test = "0.3.80"
wasm-streams = "0.7.1"
web-sys = "0.3.107"
web-time = "1.1.0"
webpki = { package = "rustls-webpki", version = "0.103.17" }
worker = { version = "0.9.0", default-features = false }
x509-cert = "0.3.1"
x509-parser = "0.18.1"
yasna = "0.6.0"
zeroize = { version = "1.9.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# wasm-bindgen needs the final module's target_features custom section.
# Binaryen performs the Worker module's release optimization afterwards.
[profile.release.package.nazo-server-worker]
strip = "debuginfo"

