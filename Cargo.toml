[workspace]
members = [
    "crates/authorization-server-core",
    "crates/digital-credentials",
    "crates/key-management",
    "crates/openid4vci",
    "crates/openid4vp",
    "crates/openid4vc-http-actix",
    "crates/persistence",
    "crates/persistence-postgres",
    "crates/authorization-server",
    "crates/authorization-server-postgres",
    "crates/authorization-server-valkey",
    "crates/authorization-server-object-store",
    "crates/nazoauth",
    "crates/operator-protocol",
    "crates/http-signatures",
    "crates/http-actix",
    "crates/identity",
    "crates/runtime-capabilities",
    "crates/resource-server",
    "crates/scim-events",
    "crates/state-store-valkey",
    "crates/crypto",
]
default-members = [
    "crates/nazoauth",
]
resolver = "3"
exclude = ["fuzz"]

[workspace.package]
version = "0.2.16"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nazozero/NazoAuth"

[workspace.dependencies]
actix-cors = "0.7.2"
actix-files = "0.7.0"
# Actix 2.15 gates server net/signal APIs; each HTTP adapter opts in explicitly.
actix-rt = { version = "2.15.0", default-features = false, features = ["net", "signal"] }
actix-web = "4.15.0"
actix-tls = "3.6.1"
anyhow = "1.0.104"
aes-gcm = "0.11.1"
arc-swap = "1.9.2"
argon2 = "0.6.0"
atomicwrites = "0.4.4"
aws-lc-rs = "1.18.1"
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = "0.4.45"
der = { version = "0.8.2", features = ["derive"] }
diesel = "2.3.13"
diesel-async = "0.9.2"
diesel_migrations = "2.3.2"
ed25519-dalek = "3.0.0"
fred = "10.1.0"
flate2 = "1.1.10"
fs2 = "0.4.3"
futures-util = "0.3.34"
futures-executor = "0.3.34"
hmac = "0.13.0"
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jsonwebtoken = { version = "11.1.0", default-features = false }
mdoc-rs = { version = "0.2.0", default-features = false, features = ["issue"] }
lru = "0.18.5"
futures-channel = "0.3.34"
coset = "0.4.2"
ciborium = "0.2.2"
lettre = { version = "0.11.23", default-features = false }
nazo-auth = { version = "0.2.0", path = "crates/authorization-server-core" }
nazo-crypto = { version = "0.2.0", path = "crates/crypto", default-features = false }
nazo-digital-credentials = { version = "0.2.0", path = "crates/digital-credentials" }
nazo-http-actix = { version = "0.2.0", path = "crates/http-actix" }
nazo-http-signatures = { version = "0.2.0", path = "crates/http-signatures" }
nazo-identity = { version = "0.2.0", path = "crates/identity" }
nazo-key-management = { version = "0.2.0", path = "crates/key-management" }
nazo-openid4vci = { version = "0.2.0", path = "crates/openid4vci" }
nazo-openid4vp = { version = "0.2.0", path = "crates/openid4vp" }
nazo-openid4vc-http-actix = { version = "0.2.0", path = "crates/openid4vc-http-actix" }
nazo-oauth-server = { version = "0.2.0", path = "crates/authorization-server" }
nazo-oauth-server-postgres = { version = "0.2.0", path = "crates/authorization-server-postgres" }
nazo-oauth-server-valkey = { version = "0.2.0", path = "crates/authorization-server-valkey" }
nazo-oauth-server-object-store = { version = "0.2.0", path = "crates/authorization-server-object-store" }
nazo-operator-protocol = { version = "0.2.0", path = "crates/operator-protocol" }
nazo-persistence = { version = "0.2.0", path = "crates/persistence" }
nazo-postgres = { version = "0.2.0", path = "crates/persistence-postgres" }
nazo-resource-server = { version = "0.2.0", path = "crates/resource-server" }
nazo-runtime-modules = { version = "0.2.0", path = "crates/runtime-capabilities" }
nazo-scim-events = { version = "0.2.0", path = "crates/scim-events" }
nazo-valkey = { version = "0.2.0", path = "crates/state-store-valkey" }
pem = "4.0.0"
pkcs8 = { version = "0.11.0", features = ["alloc"] }
p256 = "0.14.0"
passkey-auth = "0.1.3"
process-wrap = { version = "10.0.1", default-features = false, features = ["creation-flags", "job-object", "kill-on-drop", "process-group", "tokio1"] }
proptest = "1.11.0"
rand = "0.10.3"
rpassword = "7.5.4"
rustix = { version = "1.1.5", features = ["fs", "process"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
webpki = { package = "rustls-webpki", version = "0.103.15" }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
sha1 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.53.2"
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["aws-lc-rs", "native-certs", "webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = "1.27.0"
wait-timeout = "0.2.1"
x509-cert = "0.3.0"
x509-parser = "0.18.1"
yasna = "0.6.0"
zeroize = { version = "1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Reviewed Actix h2 0.4 port, pinned to an immutable upstream fork revision.
[patch.crates-io]
actix-http = { git = "https://github.com/nazozero/actix-web", rev = "5efd453eaca0f997d94d4bd527df89ee0c3d21fa" }
# Reviewed mdoc-rs coset 0.4 port, pinned to an immutable upstream fork revision.
mdoc-rs = { git = "https://github.com/nazozero/mdoc-rs", rev = "40e5ac7e1739150870c41544219345c2b6de4c9b" }
