name: jiff-review-once
on:
  push:
    branches: [validation/jiff-continuation-20261118]
    paths: [.github/workflows/jiff-review-once.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'nazozero/NazoAuth'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: jiff-continuation-review
          cache-on-failure: true
      - name: Preserve the existing audit hash and receipt signing formats
        shell: python
        run: |
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              assert text.count(old)==1, (path, old, text.count(old))
              p.write_text(text.replace(old,new))
          replace('crates/persistence/src/audit_wire.rs',
                  '// Anchor v2 has a frozen byte representation: fractional precision is 0, 3,\n// 6 or 9 digits. Jiff\'s default minimal precision would change old batches.\n// collect_str writes directly into the serializer without a temporary String.\nfn serialize_audit_timestamp',
                  '/// Serialize the frozen audit timestamp format for checkpoints and receipts.\n/// Fractional precision is 0, 3, 6 or 9 digits, with a UTC Z offset.\n/// Writes directly into the serializer without an intermediate timestamp String.\npub fn serialize_audit_timestamp')
          p='crates/server/src/adapters/audit_anchor/protocol.rs'
          replace(p, '    pub(super) received_at: Timestamp,',
                  '    #[serde(serialize_with = "nazo_persistence::audit_wire::serialize_audit_timestamp")]\n    pub(super) received_at: Timestamp,')
          replace(p, '    received_at: Timestamp,',
                  '    #[serde(serialize_with = "nazo_persistence::audit_wire::serialize_audit_timestamp")]\n    received_at: Timestamp,')
          p='perf/audit-anchor-receiver/src/wire.rs'
          replace(p, '    hasher.update(&occurred_at.as_microsecond().to_be_bytes());',
                  '    // Audit v1 floors Unix microseconds, including pre-epoch fractions.\n    let micros = occurred_at.as_nanosecond().div_euclid(1_000) as i64;\n    hasher.update(&micros.to_be_bytes());')
          replace(p, '    pub received_at: Timestamp,',
                  '    #[serde(serialize_with = "serialize_audit_timestamp")]\n    pub received_at: Timestamp,')
          replace(p, '    received_at: Timestamp,',
                  '    #[serde(serialize_with = "serialize_audit_timestamp")]\n    received_at: Timestamp,')
          replace(p, '#[cfg(test)]\n#[path = "../tests/wire.rs"]', '''// Kept independent of the exporter so fixture signatures detect wire drift.
          fn serialize_audit_timestamp<S: serde::Serializer>(
              value: &Timestamp,
              serializer: S,
          ) -> std::result::Result<S::Ok, S::Error> {
              let nanos = value.subsec_nanosecond();
              let precision = if nanos == 0 {
                  0
              } else if nanos % 1_000_000 == 0 {
                  3
              } else if nanos % 1_000 == 0 {
                  6
              } else {
                  9
              };
              serializer.collect_str(&format_args!("{value:.precision$}"))
          }

          #[cfg(test)]
          #[path = "../tests/wire.rs"]''')
          cases='''[
                  ("2026-11-17T00:00:00Z", "2026-11-17T00:00:00Z"),
                  ("2026-11-17T00:00:00.1Z", "2026-11-17T00:00:00.100Z"),
                  ("2026-11-17T00:00:00.1234Z", "2026-11-17T00:00:00.123400Z"),
                  ("2026-11-17T00:00:00.1234567Z", "2026-11-17T00:00:00.123456700Z"),
                  ("1969-12-31T23:59:59.999999999Z", "1969-12-31T23:59:59.999999999Z"),
                  ("2026-11-17T01:00:00.12+01:00", "2026-11-17T00:00:00.120Z"),
              ]'''
          body='''r#"{{"schema_version":"nazo.audit.anchor.receipt.v1","checkpoint_kind":"batch","status":"accepted","deployment_id":"deployment-1","first_sequence":1,"last_sequence":1,"event_count":1,"last_hash":"{}","batch_digest":"{}","received_at":"{}","reject_reason":null,"permanent":false}}"#'''
          p=Path('crates/server/tests/unit/adapters/audit_anchor.rs')
          p.write_text(p.read_text()+'''\n#[test]
          fn legacy_receipt_signing_bytes_preserve_fractional_precision() {
              let batch = batch(vec![delivery(1)]);
              let expectation = batch_expectation("deployment-1", &batch);
              for (input, canonical) in '''+cases+''' {
                  let frozen = format!(
                      '''+body+''',
                      expectation.last_hash, expectation.batch_digest, canonical,
                  );
                  // Sign the frozen pre-migration bytes, not receipt_signing_body's output.
                  let signature = test_signing_key().sign(frozen.as_bytes());
                  let mut wire: Value = serde_json::from_str(&frozen).unwrap();
                  wire["received_at"] = json!(input);
                  wire["signature"] = json!(encode_hash(&signature.to_bytes()));
                  let receipt: AnchorReceipt = serde_json::from_value(wire.clone()).unwrap();
                  assert_eq!(receipt_signing_body(&receipt).unwrap(), frozen.as_bytes());
                  assert_eq!(serde_json::to_value(&receipt).unwrap()["received_at"], canonical);
                  assert_eq!(
                      verify_receipt(&serde_json::to_vec(&wire).unwrap(), &test_verify_key(), &expectation),
                      Ok(ReceiptVerdict::Accepted { duplicate: false }),
                  );
              }
          }
          ''')
          p=Path('perf/audit-anchor-receiver/tests/wire.rs')
          p.write_text(p.read_text()+'''\n#[test]
          fn event_hash_retains_floor_rounded_microseconds_on_both_sides_of_epoch() {
              let hash = |at| event_hash(1, &[0; 32], Uuid::nil(), "event", "security", at, b"{}");
              for (nanos, micros) in [(-1001, -2), (-1000, -1), (-999, -1), (-1, -1),
                                      (0, 0), (1, 0), (999, 0), (1000, 1), (1001, 1)] {
                  assert_eq!(hash(Timestamp::from_nanosecond(nanos).unwrap()),
                             hash(Timestamp::from_microsecond(micros).unwrap()));
              }
              assert_ne!(hash(Timestamp::UNIX_EPOCH), hash(Timestamp::from_microsecond(-1).unwrap()));
          }

          #[test]
          fn receipt_signatures_match_frozen_pre_migration_bytes() {
              let key = SigningKey::from_bytes(&[7; 32]);
              let last_hash = encode_hash(&[2; 32]);
              let digest = encode_hash(&[3; 32]);
              for (input, canonical) in '''+cases+''' {
                  let mut receipt = receipt_for("batch", "accepted", "deployment-1", 1, 1, 1,
                                                &last_hash, &digest, None, false);
                  receipt.received_at = input.parse().unwrap();
                  let body = sign_receipt(receipt, &key).unwrap();
                  assert_eq!(serde_json::from_slice::<serde_json::Value>(&body).unwrap()["received_at"], canonical);
                  let receipt: AnchorReceipt = serde_json::from_slice(&body).unwrap();
                  let signature: [u8; 64] = URL_SAFE_NO_PAD.decode(receipt.signature).unwrap().try_into().unwrap();
                  let frozen = format!(
                      '''+body+''',
                      last_hash, digest, canonical,
                  );
                  key.verifying_key().verify_strict(frozen.as_bytes(), &ed25519_dalek::Signature::from_bytes(&signature)).unwrap();
              }
          }
          ''')
          replace('docs/integration/jiff-migration.md',
                  '1970. Audit-anchor v2 serializes 0/3/6/9 fractional digits and a `Z` offset;\nruntime-management JSON retains 0/3/6/9 digits and `+00:00`. These frozen formats',
                  '1970. Audit-anchor v2 checkpoints and v1 receipt signatures serialize 0/3/6/9\nfractional digits and a `Z` offset. The independent receiver uses the same frozen\nformat, including pre-epoch hash rounding. Runtime-management JSON retains\n0/3/6/9 digits and `+00:00`. These frozen formats')
      - name: Reconcile the receiver's independent lockfile and format the changes
        run: |
          mkdir -p /tmp/jiff-audit
          cargo metadata --manifest-path perf/audit-anchor-receiver/Cargo.toml --format-version 1 > /tmp/jiff-audit/receiver-metadata.json
          cargo fmt --all
          cargo fmt --manifest-path perf/audit-anchor-receiver/Cargo.toml
          git diff --check
          git add crates/persistence/src/audit_wire.rs crates/server/src/adapters/audit_anchor/protocol.rs crates/server/tests/unit/adapters/audit_anchor.rs perf/audit-anchor-receiver docs/integration/jiff-migration.md
          git diff --cached > /tmp/jiff-audit/compatibility.diff
          python3 scripts/verify_static_contracts.py --check
      - name: Verify the independent receiver and frozen receipt vectors
        run: |
          set +e
          cargo test --manifest-path perf/audit-anchor-receiver/Cargo.toml --locked > /tmp/jiff-audit/receiver-tests.log 2>&1
          code=$?
          tail -100 /tmp/jiff-audit/receiver-tests.log
          exit "$code"
      - name: Verify production audit and receipt boundaries
        run: |
          set +e
          cargo test --locked --all-features -p nazo-persistence --lib > /tmp/jiff-audit/persistence-tests.log 2>&1
          first=$?
          cargo test --locked --all-features -p nazo-server --lib receipt > /tmp/jiff-audit/receipt-tests.log 2>&1
          second=$?
          tail -70 /tmp/jiff-audit/persistence-tests.log
          tail -70 /tmp/jiff-audit/receipt-tests.log
          test "$first" -eq 0 && test "$second" -eq 0
      - name: Check all production targets with warnings denied
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked --keep-going -- -D warnings > /tmp/jiff-audit/clippy.log 2>&1
          code=$?
          tail -70 /tmp/jiff-audit/clippy.log
          exit "$code"
      - name: Commit the verified compatibility repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(audit): preserve receipt signing bytes and independent receiver time semantics'
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $header" push origin HEAD:refs/heads/validation/jiff-continuation-20261118
          git rev-parse HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: jiff-audit-compatibility-evidence
          path: /tmp/jiff-audit
          retention-days: 1
