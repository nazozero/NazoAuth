name: jiff-review-once
on:
  push:
    branches: [validation/jiff-continuation-20261118]
    paths: [.github/workflows/jiff-review-once.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'nazozero/NazoAuth'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: jiff-continuation-review
          cache-on-failure: true
      - name: Repair the remaining server test and performance fixture
        shell: python
        run: |
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, (path, text.count(old))
              p.write_text(text.replace(old, new))
          replace('crates/server/tests/unit/keyctl/openid4vc_material.rs',
                  '    let start =\n        chrono::DateTime::from_timestamp(original_ca.validity().not_before.timestamp(), 0).unwrap();\n    let limit = start.checked_add_months(chrono::Months::new(240)).unwrap();',
                  '''    let start = jiff::Timestamp::from_second(original_ca.validity().not_before.timestamp())
                  .unwrap();
              let limit = jiff::tz::Offset::UTC
                  .to_datetime(start)
                  .checked_add(jiff::Span::new().years(20))
                  .unwrap();
              let limit = jiff::tz::Offset::UTC.to_timestamp(limit).unwrap();''')
          replace('crates/server/examples/mdoc_http_performance/api.rs',
                  '    let issued_at: jiff::Timestamp =\n        chrono::DateTime::from_timestamp(jiff::Timestamp::now().timestamp(), 0).unwrap();',
                  '    let issued_at = jiff::Timestamp::from_second(jiff::Timestamp::now().as_second()).unwrap();')
          residual = [str(p) for p in Path('crates').rglob('*.rs') if 'chrono::' in p.read_text()]
          assert not residual, residual
      - name: Format and check unchanged architecture contracts
        run: |
          cargo fmt --all
          git diff --check
          mkdir -p /tmp/jiff-final
          git add crates/server/tests/unit/keyctl/openid4vc_material.rs crates/server/examples/mdoc_http_performance/api.rs
          git diff --cached > /tmp/jiff-final/fixture.diff
          python3 scripts/verify_static_contracts.py --check
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libpq-dev
      - name: Run warnings-denied Clippy for every target
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked --keep-going -- -D warnings > /tmp/jiff-final/clippy.log 2>&1
          code=$?
          tail -120 /tmp/jiff-final/clippy.log
          exit "$code"
      - name: Execute certificate material boundary regressions
        run: |
          set +e
          cargo test -p nazo-server --lib --all-features --locked openid4vc_material > /tmp/jiff-final/server-tests.log 2>&1
          code=$?
          tail -120 /tmp/jiff-final/server-tests.log
          exit "$code"
      - name: Commit only the tested fixture repairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(time): finish native Jiff certificate and HTTP performance fixtures'
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $header" push origin HEAD:refs/heads/validation/jiff-continuation-20261118
          git rev-parse HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: jiff-final-fixture-evidence
          path: /tmp/jiff-final
          retention-days: 1
