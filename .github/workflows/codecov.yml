name: codecov

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codecov.yml"
      - "codecov.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "requirements/codecov.txt"
      - "crates/**"
      - "src/**"
      - "scripts/generate_codecov_lcov.sh"
      - "scripts/merge_lcov.py"
      - "tests/**"
      - "benches/**"
      - "examples/**/*.rs"
      - "examples/**/Cargo.toml"
      - "examples/**/Cargo.lock"
      - "migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: llvm-tools-preview, rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
          workspaces: ". -> target/codecov-coverage"

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libpq-dev

      - name: Install Python E2E dependencies
        run: python -m pip install --require-hashes -r requirements/codecov.txt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-llvm-cov@0.9.0

      - name: Verify deterministic LCOV union
        run: python -m unittest tests.unit.test_merge_lcov

      - name: Generate coverage report
        shell: bash
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_TERM_COLOR: never
          CARGO_TARGET_DIR: target/codecov-coverage
        run: bash scripts/generate_codecov_lcov.sh

      - name: Preserve normalized coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-${{ github.sha }}
          path: lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
