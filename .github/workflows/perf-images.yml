name: performance-images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inputs:
    uses: ./.github/workflows/ci-inputs.yml
    with:
      scope: perf

  build-and-smoke:
    needs: inputs
    if: "!cancelled() && (needs.inputs.result != 'success' || needs.inputs.outputs.run != 'false')"
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: performance runner
            containerfile: perf/runner/Containerfile
            image: nazoauth-perf-runner:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.containerfile }}
          tags: ${{ matrix.image }}
          pull: true
          load: true
          cache-from: type=gha,scope=nazoauth-performance-runner
          cache-to: type=gha,mode=max,scope=nazoauth-performance-runner

      - name: Smoke test image
        shell: bash
        run: docker run --rm "${{ matrix.image }}" --version
