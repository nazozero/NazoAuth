name: performance-images

on:
  pull_request:
    paths:
      - "perf/**"
      - ".github/workflows/perf-images.yml"
  push:
    branches: [main]
    paths:
      - "perf/**"
      - ".github/workflows/perf-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: performance runner
            containerfile: perf/runner/Containerfile
            image: nazoauth-perf-runner:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --pull --file "${{ matrix.containerfile }}" --tag "${{ matrix.image }}" .

      - name: Smoke test image
        shell: bash
        run: docker run --rm --entrypoint python "${{ matrix.image }}" -c 'import argon2, blake3, cryptography, psycopg, redis; print("performance dependencies import successfully")'
