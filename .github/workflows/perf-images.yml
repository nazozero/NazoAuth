name: performance-images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inputs:
    uses: ./.github/workflows/ci-inputs.yml
    with:
      scope: perf

  build-and-smoke:
    needs: inputs
    if: needs.inputs.outputs.run == 'true'
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: performance runner
            containerfile: perf/runner/Containerfile
            image: nazoauth-perf-runner:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --pull --file "${{ matrix.containerfile }}" --tag "${{ matrix.image }}" .

      - name: Smoke test image
        shell: bash
        run: docker run --rm --entrypoint python "${{ matrix.image }}" -c 'import argon2, blake3, cryptography, orjson, psycopg, redis; print("performance dependencies import successfully")'

      - name: Verify native k6 JSON evidence
        run: docker run --rm --env PYTHONPATH=/ --entrypoint python "${{ matrix.image }}" -m unittest perf.tests.test_capacity_producer.BufferedJsonOutputTest -v
