name: operator-fuzz

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inputs:
    uses: ./.github/workflows/ci-inputs.yml
    with:
      scope: fuzz

  operator-parser-fuzz:
    needs: inputs
    if: "!cancelled() && (needs.inputs.result != 'success' || needs.inputs.outputs.run != 'false')"
    name: Operator JWS parser fuzz gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0

      - name: Check the fuzz lockfile and install the pinned tools
        run: |
          cargo tree --manifest-path fuzz/Cargo.toml --locked --depth 0
          rustup toolchain install nightly-2026-10-04 --profile minimal
          cargo +nightly-2026-10-04 install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz closed operator JWS parser
        run: cargo +nightly-2026-10-04 fuzz run operator_jws_parser -- -max_total_time=60 -rss_limit_mb=512 -timeout=10
