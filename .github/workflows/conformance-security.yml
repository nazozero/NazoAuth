name: conformance-security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inputs:
    uses: ./.github/workflows/ci-inputs.yml
    with:
      scope: security

  source-policy-gate:
    needs: inputs
    if: "!cancelled() && (needs.inputs.result != 'success' || needs.inputs.outputs.run != 'false')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.0"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile the real HTTP policy scripts
        run: python -m py_compile scripts/full_real_request_source_policy.py scripts/rfc9967_scim_set_e2e.py
      - name: Check real HTTP source policy
        run: python scripts/rfc9967_scim_set_e2e.py --source-policy-check
      - name: Test the real HTTP source policy
        run: python tests/unit/test_rfc9967_scim_set_e2e_source_policy.py

  supply-chain-gate:
    needs: inputs
    if: "!cancelled() && (needs.inputs.result != 'success' || needs.inputs.outputs.run != 'false')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libpq-dev
      - name: Install pinned Rust supply-chain tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: |
            cargo-deny@0.20.2
            cargo-cyclonedx@0.5.9
      - name: Check dependency policy
        run: cargo deny check advisories bans licenses sources
      - name: Generate Rust SBOM
        run: >-
          cargo cyclonedx --manifest-path crates/server/Cargo.toml --format json --override-filename nazoauth.cdx &&
          mkdir -p target &&
          mv crates/server/nazoauth.cdx.json target/nazoauth.cdx.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build service image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          no-cache-filters: runtime-base,runtime,development-runtime,perf-runtime
          tags: nazo-oauth-supply-chain:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=nazo-oauth-service
          cache-to: type=gha,mode=max,scope=nazo-oauth-service
      - name: Scan service image
        env:
          TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
        run: bash .github/e2e-scan-service-image.sh
      - name: Upload scanned service image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nazo-oauth-service-image-${{ github.sha }}
          path: target/ci-service-image
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nazoauth-rust-sbom
          path: target/nazoauth.cdx.json
          if-no-files-found: error

  real-http-security-matrix:
    runs-on: ubuntu-latest
    needs:
      - source-policy-gate
      - supply-chain-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download scanned service image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nazo-oauth-service-image-${{ github.sha }}
          path: target/ci-service-image
      - name: Load scanned service image
        run: >-
          docker load --input target/ci-service-image/nazo-oauth-service.tar &&
          docker tag "nazo-oauth-supply-chain:$GITHUB_SHA" nazo-oauth-e2e:latest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build E2E runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: nazo-oauth-e2e-runner:latest
          load: true
          cache-from: type=gha,scope=nazo-oauth-e2e-runner
          cache-to: type=gha,mode=max,scope=nazo-oauth-e2e-runner
          file: .github/e2e-runner.Containerfile
      - name: Prepare isolated runtime config
        run: bash .github/e2e-fixture.sh configure
      - name: Start PostgreSQL and Valkey
        env:
          POSTGRES_IMAGE: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          VALKEY_IMAGE: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        run: bash .github/e2e-fixture.sh start-dependencies
      - name: Migrate and start server
        run: bash .github/e2e-fixture.sh start-server
      - name: Require both non-root servers to become ready
        run: bash .github/e2e-fixture.sh wait-for-servers
      - name: Run RFC 9967 SCIM SET black-box matrix
        run: >-
          docker run --rm --name nazo-oauth-rfc9967-runner --network nazo-oauth-e2e-net
          -v "$PWD:/app" -w /app
          -e E2E_BASE_URL=http://nazo-oauth-e2e-server:8000
          -e E2E_ISSUER_URL=http://127.0.0.1:8000
          -e E2E_TENANT_HOST=127.0.0.1:8000
          -e E2E_DATABASE_URL=postgresql://postgres:postgres@nazo-oauth-e2e-postgres:5432/oauth
          nazo-oauth-e2e-runner:latest python scripts/rfc9967_scim_set_e2e.py
      - name: Run load and race gate
        run: >-
          docker run --rm --name nazo-oauth-e2e-runner --network nazo-oauth-e2e-net
          -v "$PWD:/app" -w /app
          -e E2E_BASE_URL=http://nazo-oauth-e2e-server:8000
          -e E2E_TENANT_HOST=127.0.0.1:8000
          -e LOAD_REQUESTS=400
          -e LOAD_CONCURRENCY=32
          nazo-oauth-e2e-runner:latest python scripts/full_real_request_load.py
      - name: Run Valkey outage injection
        run: >-
          docker stop nazo-oauth-e2e-valkey &&
          docker run --rm --name nazo-oauth-e2e-runner --network nazo-oauth-e2e-net
          -v "$PWD:/app" -w /app
          -e E2E_BASE_URL=http://nazo-oauth-e2e-server:8000
          -e E2E_TENANT_HOST=127.0.0.1:8000
          nazo-oauth-e2e-runner:latest python scripts/valkey_failure_injection.py
      - name: Cleanup
        if: always()
        run: bash .github/e2e-fixture.sh cleanup
