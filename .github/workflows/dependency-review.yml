name: dependency-review

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-review.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - "Containerfile"
      - ".github/e2e-runner.Containerfile"
      - ".github/e2e-requirements.in"
      - ".github/e2e-requirements.txt"
      - ".github/workflows/*.yml"
      - ".github/dependabot.yml"
      - "renovate.json"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency vulnerability review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false

  rust-advisory-audit:
    name: Rust advisory audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0

      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@0.23.0

      - name: Audit Rust advisories
        run: cargo audit
