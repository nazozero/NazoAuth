name: Jiff dependency policy

on:
  push:
    branches: [audit/passkey-resume-20261118]
    paths: [.github/workflows/jiff-dependency-policy.yml]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: '1.100.0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: validation/jiff-continuation-20261118
          path: candidate
          persist-credentials: false
          show-progress: false
      - name: Install pinned compiler
        run: rustup toolchain install 1.100.0 --profile minimal
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-deny@0.20.2
      - name: Check existing policy without exceptions
        working-directory: candidate
        shell: bash
        run: |
          set +e
          mkdir -p ../evidence
          git rev-parse HEAD HEAD^{tree} > ../evidence/source.txt
          sha256sum Cargo.lock deny.toml > ../evidence/policy-inputs.sha256
          cargo deny check advisories bans licenses sources > ../evidence/deny.log 2>&1
          echo $? > ../evidence/deny.exit
          cargo metadata --locked --format-version 1 > ../metadata.json 2> ../evidence/metadata.stderr
          echo $? > ../evidence/metadata.exit
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('../metadata.json').read_text())
          names = {'chrono', 'jiff', 'jiff-diesel', 'nazo-mdoc', 'passkey-auth', 'der', 'x509-cert', 'webpki-roots', 'webpki-root-certs'}
          packages = [{k:p.get(k) for k in ('name','version','source','license','dependencies')} for p in value['packages'] if p['name'] in names]
          Path('../evidence/selected-dependencies.json').write_text(json.dumps(packages, indent=2) + '\n')
          print('\n'.join(f"{p['name']} {p['version']} {p['source']}" for p in packages))
          PY
          tail -100 ../evidence/deny.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: jiff-dependency-policy
          path: evidence/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: always()
        with:
          ref: audit/passkey-resume-20261118
          path: results
          persist-credentials: true
          show-progress: false
      - name: Preserve policy findings without changing application code
        if: always()
        working-directory: results
        run: |
          set -euo pipefail
          mkdir -p docs/evidence/jiff-dependency-continuation
          cp ../evidence/* docs/evidence/jiff-dependency-continuation/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/jiff-dependency-continuation
          git commit -m 'test(deps): record unchanged Jiff candidate dependency policy outcome'
          git push origin "HEAD:refs/heads/audit/jiff-dependencies-$GITHUB_RUN_ID"
          exit "$(cat ../evidence/deny.exit)"
