name: audit-scale

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-scale:
    name: Million-row audit SQL plans
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: docker.io/library/postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_DB: nazo_audit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nazo_audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NAZO_AUDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nazo_audit_test
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
      CARGO_TERM_COLOR: never
      RUSTFLAGS: '-C link-arg=-Wl,--threads=1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace-quality
      - name: Install PostgreSQL client library
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libpq-dev
      - name: Verify one-million and fifteen-million row backlogs
        run: >-
          cargo test --locked --all-features -p nazo-postgres --test audit_ledger
          audit_claim_is_bounded_at_million_row_backlogs -- --ignored --exact --nocapture
