name: model-audit-types

on:
  push:
    branches: [refactor/exhaustive-model-audit-20261009]
    paths: [.github/workflows/model-audit-types.yml]

permissions:
  contents: read

jobs:
  baseline-field-references:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7d7ed5fddc5c91201bcac94553a6e72836d471d7
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: model-audit-baseline-types
          cache-on-failure: true
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libpq-dev
      - name: Capture type-resolved expression bodies with original source spans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/model-audit-types/thir
          git rev-parse HEAD > /tmp/model-audit-types/source-sha.txt
          rustc --version --verbose > /tmp/model-audit-types/compiler.txt
          cargo metadata --no-deps --format-version 1 > /tmp/model-audit-types/metadata.json
          python3 - <<'PY' > /tmp/model-audit-types/packages.txt
          import json
          m = json.load(open('/tmp/model-audit-types/metadata.json'))
          members = set(m['workspace_members'])
          for package in m['packages']:
              if package['id'] in members and any('lib' in t['kind'] for t in package['targets']):
                  print(package['name'])
          PY
          while read -r package; do
            # Compiler diagnostics only. Production flags and dependencies are unchanged.
            RUSTC_BOOTSTRAP=1 cargo rustc -p "$package" --lib --all-features --locked \
              -- -Zunpretty=thir-flat 2> "/tmp/model-audit-types/thir/$package.log" \
              | gzip -1 > "/tmp/model-audit-types/thir/$package.txt.gz"
          done < /tmp/model-audit-types/packages.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: baseline-field-references-${{ github.sha }}
          path: /tmp/model-audit-types/
          retention-days: 2
          if-no-files-found: error
