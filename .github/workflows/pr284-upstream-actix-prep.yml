name: PR284 upstream Actix preparation
on:
  push:
    branches: [maintenance/pr284-upstream-actix-prep]
permissions:
  contents: write
concurrency:
  group: pr284-upstream-preparation
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: cd10551d79b2ea688a54309dda32a0055f4f938f
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace-quality
          cache-on-failure: true
      - name: Budget compilation and install existing native dependencies
        run: |
          python3 scripts/ci_build_jobs.py >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libpq-dev
      - name: Apply reviewed transport changes
        run: |
          python3 .github/pr284-upstream-actix.py
          python3 .github/pr284-upstream-fixups.py
          cargo update -p actix-http -p actix-router
          cargo fmt --all
          python3 scripts/verify_static_contracts.py --check
          python3 scripts/check_native_transport.py
          cargo tree --locked -p nazo-server -i h2 -e normal
      - name: Check complete workspace with strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Verify production adapter contracts
        run: cargo test --locked -p nazo-http-actix --lib
      - name: Verify HTTP/1.1 TLS and mTLS plus h2-only rejection
        run: cargo test --locked -p nazo-server --lib direct_tls_serves_real_https_and_mtls_without_trusting_forged_headers -- --nocapture
      - name: Publish reviewed source tree without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/pr284-upstream-actix.py .github/pr284-upstream-fixups.py .github/workflows/pr284-upstream-actix-prep.yml
          git add -A
          git diff --cached --check "$BASE_SHA"
          git diff --cached --stat "$BASE_SHA"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path
          base = os.environ['BASE_SHA']
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', base], text=True).splitlines()
          allowed = {
              'Cargo.toml', 'Cargo.lock', '.github/workflows/code-quality.yml',
              'crates/http-actix/src/lib.rs', 'crates/http-actix/tests/unit/transport.rs',
              'crates/server/src/bootstrap/startup/services/factory.rs',
              'crates/server/tests/unit/bootstrap.rs',
              'crates/server/tests/unit/bootstrap/startup/services/factory.rs',
              'scripts/check_native_transport.py',
              'docs/integration/rust-embedding.md', 'docs/operations/configuration.md',
              'docs/project/testing.md',
          }
          assert set(paths) <= allowed, sorted(set(paths) - allowed)
          entries = [{'path': path, 'mode': '100644', 'type': 'blob', 'content': Path(path).read_text()} for path in paths]
          tree = subprocess.check_output(['git', 'rev-parse', base + '^{tree}'], text=True).strip()
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/trees',
              data=json.dumps({'base_tree': tree, 'tree': entries}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          print('CANDIDATE_TREE=' + result['sha'])
          print('CANDIDATE_PARENT=' + base)
          print('No branch or PR has been changed by this job.')
          PY
