name: PR284 upstream Actix preparation
on:
  push:
    branches: [maintenance/pr284-upstream-actix-prep]
permissions:
  contents: write
concurrency:
  group: pr284-upstream-preparation
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: cd10551d79b2ea688a54309dda32a0055f4f938f
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          components: rustfmt
      - name: Reproduce the candidate validated in run 44019169990
        run: |
          python3 .github/pr284-upstream-actix.py
          python3 .github/pr284-upstream-fixups.py
          cargo update -p actix-http -p actix-router
          cargo fmt --all
          python3 scripts/verify_static_contracts.py --check
          python3 scripts/check_native_transport.py
          git diff -- Cargo.lock
      - name: Export candidate files without updating refs or workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/pr284-upstream-actix.py .github/pr284-upstream-fixups.py .github/workflows/pr284-upstream-actix-prep.yml
          git add -A
          git diff --cached --check "$BASE_SHA"
          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path
          base = os.environ['BASE_SHA']
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', base], text=True).splitlines()
          allowed = {
              'Cargo.toml', 'Cargo.lock', '.github/workflows/code-quality.yml',
              'crates/http-actix/src/lib.rs', 'crates/http-actix/tests/unit/transport.rs',
              'crates/server/src/bootstrap/startup/services/factory.rs',
              'crates/server/tests/unit/bootstrap.rs',
              'crates/server/tests/unit/bootstrap/startup/services/factory.rs',
              'scripts/check_native_transport.py',
              'docs/integration/rust-embedding.md', 'docs/operations/configuration.md',
              'docs/project/testing.md',
          }
          assert set(paths) <= allowed, sorted(set(paths) - allowed)
          output = Path(os.environ['RUNNER_TEMP']) / 'pr284-candidate'
          output.mkdir()
          entries = []
          for path in paths:
              destination = output / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, destination)
          for path in paths:
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                  data=json.dumps({'content': Path(path).read_text(), 'encoding': 'utf-8'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  print('Blob export failed: ' + error.read().decode())
                  raise
              expected = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert result['sha'] == expected, path
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': expected})
          print('CANDIDATE_BLOBS=' + json.dumps(entries))
          print('CANDIDATE_PARENT=' + base)
          print('No branch, PR, or workflow has been updated by this job.')
          (output / 'blobs.json').write_text(json.dumps(entries, indent=2))
          PY
      - name: Preserve exact generated source
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr284-upstream-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/pr284-candidate
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
