name: code-quality

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/code-quality.yml"
      - ".github/workflows/release-policy.yml"
      - ".github/workflows/release-security.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "crates/**"
      - "src/**"
      - "tests/**"
      - "fuzz/**"
      - "benches/**"
      - "examples/**/*.rs"
      - "examples/**/Cargo.toml"
      - "examples/**/Cargo.lock"
      - "migrations/**"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"
      - "perf/**"
  pull_request:
    paths:
      - ".github/workflows/code-quality.yml"
      - ".github/workflows/release-policy.yml"
      - ".github/workflows/release-security.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "crates/**"
      - "src/**"
      - "tests/**"
      - "fuzz/**"
      - "benches/**"
      - "examples/**/*.rs"
      - "examples/**/Cargo.toml"
      - "examples/**/Cargo.lock"
      - "migrations/**"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"
      - "perf/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: oauth
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oauth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oauth
      NAZO_AUDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nazo_audit_test
      VALKEY_URL: redis://127.0.0.1:6379/0
      VALKEY_STATE_EPOCH: "019c8ca2-30a6-7000-8000-00000000e102"
      VALKEY_COMMAND_TIMEOUT_MS: "1000"
      BIND: 127.0.0.1:18000
      ISSUER: http://127.0.0.1:18000
      MTLS_ENDPOINT_BASE_URL: http://127.0.0.1:18000
      FRONTEND_BASE_URL: http://127.0.0.1:3000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
      COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: nazo_oauth_session
      CSRF_COOKIE_NAME: nazo_oauth_csrf
      EMAIL_DELIVERY: disabled
      EMAIL_CODE_DEV_RESPONSE_ENABLED: "false"
      AVATAR_STORAGE_DIR: runtime/ci/avatars
      SIGNING_KEY_ENCRYPTION_KEY_ID: ci-signing-root
      SIGNING_KEY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      NAZO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      NAZO_TEST_S3_BUCKET: nazo-avatar-test
      NAZO_TEST_S3_ACCESS_KEY: sharedstate-test
      NAZO_TEST_S3_SECRET_KEY: sharedstate-test-only
      NAZO_TEST_S3_REGION: us-east-1
      REQUIRE_PUSHED_AUTHORIZATION_REQUESTS: "false"
      FEDERATION_PROVIDER_CONFIGS: >-
        [{"provider_id":"ci-oidc","enabled":true,"display_name":"CI OIDC","adapter_type":"oidc","issuer":"https://issuer.example","authorization_endpoint":"https://issuer.example/authorize","token_endpoint":"https://issuer.example/token","jwks_url":"https://issuer.example/jwks","client_id":"ci-oidc-client","client_secret":"ci-oidc-secret","redirect_uri":"http://127.0.0.1:18000/auth/federation/ci-oidc/callback","scopes":"openid email profile"}]
      FEDERATION_SAML_GATEWAY_ENABLED: "true"
      FEDERATION_SAML_GATEWAY_ISSUER: ci-saml-gateway
      FEDERATION_SAML_GATEWAY_AUDIENCE: nazo-oauth-ci
      FEDERATION_SAML_GATEWAY_SECRET: ci-saml-gateway-secret-000000000000
      RUST_TEST_THREADS: "1"
      CARGO_TERM_COLOR: never
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: workspace-quality

      - name: Budget build concurrency from runner resources
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          cpus = len(os.sched_getaffinity(0))
          memory = int(next(line.split()[1] for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:'))) * 1024
          limit = Path('/sys/fs/cgroup/memory.max')
          if limit.exists() and limit.read_text().strip() != 'max':
              memory = min(memory, int(limit.read_text()))
          jobs = max(1, min(cpus, memory // (3 * 1024**3)))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'CARGO_BUILD_JOBS={jobs}\n')
          print(f'available CPUs={cpus}, memory budget={memory}, cargo jobs={jobs}; shared-state test threads=1')
          PY

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libpq-dev postgresql-client

      - name: Prepare runtime directories
        run: mkdir -p runtime/ci/avatars

      - name: Prepare isolated avatar object storage
        run: |
          docker build --file tests/fixtures/minio/Containerfile --tag nazoauth-test-minio:ci .
          docker run --detach --name avatar-store --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER="$NAZO_TEST_S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$NAZO_TEST_S3_SECRET_KEY" \
            nazoauth-test-minio:ci \
            server /data
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$NAZO_TEST_S3_ENDPOINT/minio/health/live"; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec avatar-store mc alias set test http://127.0.0.1:9000 \
            "$NAZO_TEST_S3_ACCESS_KEY" "$NAZO_TEST_S3_SECRET_KEY"
          docker exec avatar-store mc mb "test/$NAZO_TEST_S3_BUCKET"

      - name: Create isolated audit ledger test database
        run: >-
          PGPASSWORD=postgres psql
          -h 127.0.0.1 -U postgres -d postgres
          -v ON_ERROR_STOP=1
          -c 'CREATE DATABASE nazo_audit_test'

      - name: Verify compatibility contracts
        run: python scripts/verify_static_contracts.py --check

      - name: Verify persistence dependency isolation
        run: python scripts/check_persistence_dependency_graph.py

      - name: Verify crypto boundary
        run: python scripts/check_crypto_boundary.py

      - name: Test crypto boundary guard
        run: python -m unittest discover -s scripts -p 'test_crypto_boundary.py'

      - name: Verify perf results layout
        run: python scripts/check_perf_results_layout.py

      - name: Format
        run: cargo fmt --check

      - name: Clippy all targets
        run: cargo clippy --workspace --all-targets --all-features --locked --keep-going -- -D warnings

      - name: Materialize the isolated CI schema through the persistence owner
        run: >-
          cargo test --all-features --locked -p nazo-postgres --test migrations
          pending_migrations_create_all_runtime_module_state_tables

      - name: Test workspace with PostgreSQL and Valkey
        # Stream test progress so an interrupted job retains its actual wait boundary.
        run: cargo test --workspace --all-features --locked --no-fail-fast -- --nocapture

  python-quality:
    name: Python script syntax gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      - name: Install streaming evidence decoder
        run: |
          python -m pip install --only-binary=:all: orjson==3.12.0

      - name: Compile Python scripts
        run: python -m compileall -q scripts perf

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"

      - name: Verify performance measurement and acceptance regressions
        run: |
          node --version
          python -m unittest \
            perf.tests.test_capacity_window perf.tests.test_capacity_producer \
            perf.tests.test_stream_cohort perf.tests.test_single_instance_scaling \
            perf.tests.test_service_affinity perf.tests.test_cnb_controller \
            perf.tests.test_pool_size_ab perf.tests.test_issuance_maintenance \
            perf.tests.test_evidence_contract perf.tests.test_audit_reconciliation \
            perf.tests.test_audit_pending_schema \
            perf.tests.test_current_capacity perf.tests.test_short_baseline \
            perf.tests.test_checkpoint_measurement.WindowContractTest
