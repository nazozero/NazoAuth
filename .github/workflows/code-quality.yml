name: code-quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inputs:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/ci-inputs.yml
    with:
      scope: rust

  coverage:
    needs: inputs
    # Coverage is a scheduled/manual measurement, not a second test suite on
    # every merge. Manual full CI also runs the uninstrumented exclusions below.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/codecov.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  rust-quality:
    needs: inputs
    if: "!cancelled() && github.event_name == 'workflow_dispatch' && (needs.inputs.result != 'success' || needs.inputs.outputs.run != 'false')"
    name: Rust quality manual gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: docker.io/library/postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_DB: oauth
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oauth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: docker.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oauth
      NAZO_AUDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nazo_audit_test
      VALKEY_URL: redis://127.0.0.1:6379/0
      VALKEY_STATE_EPOCH: "019c8ca2-30a6-7000-8000-00000000e102"
      VALKEY_COMMAND_TIMEOUT_MS: "1000"
      BIND: 127.0.0.1:18000
      ISSUER: http://127.0.0.1:18000
      MTLS_ENDPOINT_BASE_URL: http://127.0.0.1:18000
      FRONTEND_BASE_URL: http://127.0.0.1:3000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
      COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: nazo_oauth_session
      CSRF_COOKIE_NAME: nazo_oauth_csrf
      EMAIL_DELIVERY: disabled
      EMAIL_CODE_DEV_RESPONSE_ENABLED: "false"
      AVATAR_STORAGE_DIR: runtime/ci/avatars
      SIGNING_KEY_ENCRYPTION_KEY_ID: ci-signing-root
      SIGNING_KEY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      NAZO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      NAZO_TEST_S3_BUCKET: nazo-avatar-test
      NAZO_TEST_S3_ACCESS_KEY: sharedstate-test
      NAZO_TEST_S3_SECRET_KEY: sharedstate-test-only
      NAZO_TEST_S3_REGION: us-east-1
      REQUIRE_PUSHED_AUTHORIZATION_REQUESTS: "false"
      FEDERATION_PROVIDER_CONFIGS: >-
        [{"provider_id":"ci-oidc","enabled":true,"display_name":"CI OIDC","adapter_type":"oidc","issuer":"https://issuer.example","authorization_endpoint":"https://issuer.example/authorize","token_endpoint":"https://issuer.example/token","jwks_url":"https://issuer.example/jwks","client_id":"ci-oidc-client","client_secret":"ci-oidc-secret","redirect_uri":"http://127.0.0.1:18000/auth/federation/ci-oidc/callback","scopes":"openid email profile"}]
      FEDERATION_SAML_GATEWAY_ENABLED: "true"
      FEDERATION_SAML_GATEWAY_ISSUER: ci-saml-gateway
      FEDERATION_SAML_GATEWAY_AUDIENCE: nazo-oauth-ci
      FEDERATION_SAML_GATEWAY_SECRET: ci-saml-gateway-secret-000000000000
      RUST_TEST_THREADS: "1"
      CARGO_TERM_COLOR: never
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          components: rustfmt, clippy

      - name: Prepare released migration reference and PostgreSQL dump client
        run: |
          git fetch --no-tags --depth=1 origin 385d23a330158ae78ff3fd55df2eac3a74cb2aec
          chmod +x scripts/pg_dump_test_container.sh
          echo "PG_DUMP=$GITHUB_WORKSPACE/scripts/pg_dump_test_container.sh" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace-quality

      - name: Budget build concurrency from runner resources
        run: python3 scripts/ci_build_jobs.py >> "$GITHUB_ENV"

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libpq-dev postgresql-client

      - name: Prepare runtime directories
        run: mkdir -p runtime/ci/avatars

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build avatar object storage fixture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/fixtures/minio/Containerfile
          tags: nazoauth-test-minio:ci
          load: true
          cache-from: type=gha,scope=nazoauth-avatar-test-fixture
          cache-to: type=gha,mode=max,scope=nazoauth-avatar-test-fixture

      - name: Prepare isolated avatar object storage
        run: |
          docker run --detach --name avatar-store --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER="$NAZO_TEST_S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$NAZO_TEST_S3_SECRET_KEY" \
            nazoauth-test-minio:ci \
            server /data
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent "$NAZO_TEST_S3_ENDPOINT/minio/health/live"; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec avatar-store mc alias set test http://127.0.0.1:9000 \
            "$NAZO_TEST_S3_ACCESS_KEY" "$NAZO_TEST_S3_SECRET_KEY"
          docker exec avatar-store mc mb "test/$NAZO_TEST_S3_BUCKET"

      - name: Create isolated audit ledger test database
        run: >-
          PGPASSWORD=postgres psql
          -h 127.0.0.1 -U postgres -d postgres
          -v ON_ERROR_STOP=1
          -c 'CREATE DATABASE nazo_audit_test'

      - name: Check native transport dependencies
        run: python3 scripts/check_native_transport.py

      - name: Format
        run: cargo fmt --check

      - name: Clippy all targets
        run: cargo clippy --workspace --all-targets --all-features --locked --keep-going -- -D warnings

      - name: Materialize the isolated CI schema through the persistence owner
        run: >-
          cargo test --all-features --locked -p nazo-postgres --test migrations
          pending_migrations_create_all_runtime_module_state_tables

      - name: Test timing contracts excluded from coverage
        if: github.event_name == 'workflow_dispatch'
        # These four tests require the uninstrumented server's timing. All
        # remaining lib/bin/integration tests belong to the coverage job.
        run: |
          cargo test --locked --all-features -p nazo-server --test tenant_directory_convergence \
            two_processes_converge_on_lifecycle_mutations_and_survive_cache_failures -- --nocapture
          cargo test --locked --all-features -p nazo-server --test token_issuance_simplification -- --nocapture

      - name: Test documentation examples outside coverage
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --workspace --all-features --locked --doc

  rust-build:
    needs: inputs
    if: "!cancelled() && github.event_name != 'workflow_dispatch' && (needs.inputs.result != 'success' || needs.inputs.outputs.run != 'false')"
    name: Build reusable Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace-test-archive
      - name: Budget build concurrency
        run: python3 scripts/ci_build_jobs.py >> "$GITHUB_ENV"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libpq-dev
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.152
      - name: Build and archive the complete test suite
        run: cargo nextest archive --workspace --all-features --locked --archive-file nextest.tar.zst
      - name: Test documentation examples
        run: cargo test --workspace --all-features --locked --doc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-tests
          path: nextest.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  rust-clippy:
    needs: inputs
    if: "!cancelled() && github.event_name != 'workflow_dispatch' && (needs.inputs.result != 'success' || needs.inputs.outputs.run != 'false')"
    name: Rust format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace-quality
      - name: Budget build concurrency
        run: python3 scripts/ci_build_jobs.py >> "$GITHUB_ENV"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libpq-dev
      - name: Check native transport dependencies
        run: python3 scripts/check_native_transport.py

      - name: Format
        run: cargo fmt --check
      - name: Clippy all targets
        run: cargo clippy --workspace --all-targets --all-features --locked --keep-going -- -D warnings

  rust-fixture:
    needs: inputs
    if: "!cancelled() && github.event_name != 'workflow_dispatch' && (needs.inputs.result != 'success' || needs.inputs.outputs.run != 'false')"
    name: Build shared S3 test fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/fixtures/minio/Containerfile
          tags: nazoauth-test-minio:ci
          load: true
          cache-from: type=gha,scope=nazoauth-avatar-test-fixture
          cache-to: type=gha,mode=max,scope=nazoauth-avatar-test-fixture
      - name: Save fixture image
        run: docker save nazoauth-test-minio:ci -o fixture.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s3-test-fixture
          path: fixture.tar
          if-no-files-found: error
          retention-days: 1

  rust-shards:
    needs: [inputs, rust-build, rust-fixture]
    if: "!cancelled() && needs.rust-build.result == 'success' && needs.rust-fixture.result == 'success'"
    name: Rust tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: docker.io/library/postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_DB: oauth
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oauth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: docker.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oauth
      NAZO_AUDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nazo_audit_test
      VALKEY_URL: redis://127.0.0.1:6379/0
      VALKEY_STATE_EPOCH: "019c8ca2-30a6-7000-8000-00000000e102"
      VALKEY_COMMAND_TIMEOUT_MS: "1000"
      BIND: 127.0.0.1:18000
      ISSUER: http://127.0.0.1:18000
      MTLS_ENDPOINT_BASE_URL: http://127.0.0.1:18000
      FRONTEND_BASE_URL: http://127.0.0.1:3000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
      COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: nazo_oauth_session
      CSRF_COOKIE_NAME: nazo_oauth_csrf
      EMAIL_DELIVERY: disabled
      EMAIL_CODE_DEV_RESPONSE_ENABLED: "false"
      AVATAR_STORAGE_DIR: runtime/ci/avatars
      SIGNING_KEY_ENCRYPTION_KEY_ID: ci-signing-root
      SIGNING_KEY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      NAZO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      NAZO_TEST_S3_BUCKET: nazo-avatar-test
      NAZO_TEST_S3_ACCESS_KEY: sharedstate-test
      NAZO_TEST_S3_SECRET_KEY: sharedstate-test-only
      NAZO_TEST_S3_REGION: us-east-1
      REQUIRE_PUSHED_AUTHORIZATION_REQUESTS: "false"
      FEDERATION_PROVIDER_CONFIGS: >-
        [{"provider_id":"ci-oidc","enabled":true,"display_name":"CI OIDC","adapter_type":"oidc","issuer":"https://issuer.example","authorization_endpoint":"https://issuer.example/authorize","token_endpoint":"https://issuer.example/token","jwks_url":"https://issuer.example/jwks","client_id":"ci-oidc-client","client_secret":"ci-oidc-secret","redirect_uri":"http://127.0.0.1:18000/auth/federation/ci-oidc/callback","scopes":"openid email profile"}]
      FEDERATION_SAML_GATEWAY_ENABLED: "true"
      FEDERATION_SAML_GATEWAY_ISSUER: ci-saml-gateway
      FEDERATION_SAML_GATEWAY_AUDIENCE: nazo-oauth-ci
      FEDERATION_SAML_GATEWAY_SECRET: ci-saml-gateway-secret-000000000000
      RUST_TEST_THREADS: "1"
      CARGO_TERM_COLOR: never
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.152
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-tests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: s3-test-fixture
      - name: Prepare PostgreSQL client and migration reference
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client libpq5
          git fetch --no-tags --depth=1 origin 385d23a330158ae78ff3fd55df2eac3a74cb2aec
          chmod +x scripts/pg_dump_test_container.sh
          echo "PG_DUMP=$GITHUB_WORKSPACE/scripts/pg_dump_test_container.sh" >> "$GITHUB_ENV"
      - name: Prepare isolated avatar object storage
        run: |
          docker load -i fixture.tar
          docker run --detach --name avatar-store --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER="$NAZO_TEST_S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$NAZO_TEST_S3_SECRET_KEY" \
            nazoauth-test-minio:ci server /data
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent "$NAZO_TEST_S3_ENDPOINT/minio/health/live"; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          docker exec avatar-store mc alias set test http://127.0.0.1:9000 "$NAZO_TEST_S3_ACCESS_KEY" "$NAZO_TEST_S3_SECRET_KEY"
          docker exec avatar-store mc mb "test/$NAZO_TEST_S3_BUCKET"
          mkdir -p runtime/ci/avatars
      - name: Create isolated audit ledger test database
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE nazo_audit_test'
      - name: Materialize the isolated CI schema
        run: >-
          cargo nextest run --archive-file nextest.tar.zst --workspace-remap "$GITHUB_WORKSPACE"
          -E 'binary(migrations) and test(=pending_migrations_create_all_runtime_module_state_tables)' --test-threads 1
      - name: Test workspace partition with PostgreSQL and Valkey
        run: >-
          cargo nextest run --archive-file nextest.tar.zst --workspace-remap "$GITHUB_WORKSPACE"
          --partition slice:${{ matrix.shard }}/6 --test-threads 1 --no-fail-fast

  rust-gate:
    needs: [inputs, rust-quality, rust-build, rust-clippy, rust-fixture, rust-shards]
    if: "!cancelled()"
    name: Rust quality gate
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event_name }}
      INPUT_RESULT: ${{ needs.inputs.result }}
      INPUT_RUN: ${{ needs.inputs.outputs.run }}
      MANUAL_RESULT: ${{ needs.rust-quality.result }}
      BUILD_RESULT: ${{ needs.rust-build.result }}
      CLIPPY_RESULT: ${{ needs.rust-clippy.result }}
      FIXTURE_RESULT: ${{ needs.rust-fixture.result }}
      SHARDS_RESULT: ${{ needs.rust-shards.result }}
    steps:
      - name: Require all applicable Rust checks
        run: |
          set -eu
          if [ "$INPUT_RESULT" = success ] && [ "$INPUT_RUN" = false ]; then exit 0; fi
          if [ "$EVENT" = workflow_dispatch ]; then test "$MANUAL_RESULT" = success; exit; fi
          test "$BUILD_RESULT" = success && test "$CLIPPY_RESULT" = success && \
            test "$FIXTURE_RESULT" = success && test "$SHARDS_RESULT" = success

  python-quality:
    name: Python script syntax gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          components: rustfmt, clippy

      - name: Install streaming evidence decoder
        run: |
          python -m pip install --only-binary=:all: orjson==3.13.0

      - name: Verify compatibility contracts
        run: python scripts/verify_static_contracts.py --check

      - name: Verify persistence dependency isolation
        run: python scripts/check_persistence_dependency_graph.py

      - name: Verify crypto boundary
        run: python scripts/check_crypto_boundary.py

      - name: Test crypto boundary guard
        run: python -m unittest discover -s scripts -p 'test_crypto_boundary.py'

      - name: Verify perf results layout
        run: python scripts/check_perf_results_layout.py

      - name: Compile Python scripts
        run: python -m compileall -q scripts perf

      - name: Verify performance publication and workflow routing
        run: |
          python -m unittest tests.unit.test_ci_execution tests.unit.test_ci_inputs
          python perf/report.py --check
