name: credential-dependency-probes

on:
  push:
    branches: [audit/credential-dependencies-20261117]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71
        with:
          targets: wasm32-unknown-unknown
      - name: Probe exact official packages on native and portable targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/credential-probes"
          cat > "$RUNNER_TEMP/credential-probes/probe.py" <<'PY'
          import datetime, json, os, pathlib, subprocess, urllib.request

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'credential-probes'
          cases = [
              ('affinidi-mdoc', '0.6.3', ['es256']),
              ('isomdl', '0.2.0', []),
              ('webauthn-rs', '0.6.2', []),
              ('passki', '0.5.0', ['rust-crypto']),
          ]
          results = []
          for name, version, features in cases:
              work = root / name
              (work / 'src').mkdir(parents=True)
              (work / '.cargo').mkdir()
              deps = f'candidate = {{ package = "{name}", version = "={version}", default-features = false, features = {json.dumps(features)} }}\n'
              (work / 'Cargo.toml').write_text('[package]\nname = "candidate-probe"\nversion = "0.0.0"\nedition = "2024"\n[workspace]\n[dependencies]\n' + deps + '\n[target.\'cfg(target_arch = "wasm32")\'.dependencies]\ngetrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }\ngetrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }\ngetrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }\nuuid = { version = "1", features = ["js"] }\n')
              (work / '.cargo/config.toml').write_text('[registry]\nglobal-min-publish-age = "3 days"\n[target.wasm32-unknown-unknown]\nrustflags = [\'--cfg\', \'getrandom_backend="wasm_js"\']\n')
              (work / 'src/lib.rs').write_text('pub fn probe() {}\n')
              row = {'package': name, 'version': version, 'features': features}
              index_path = (name[:2] + '/' + name[2:4] + '/' + name) if len(name) >= 4 else '3/' + name[0] + '/' + name
              request = urllib.request.Request('https://index.crates.io/' + index_path, headers={'User-Agent': 'NazoAuth dependency audit'})
              entries = [json.loads(line) for line in urllib.request.urlopen(request, timeout=30).read().decode().splitlines()]
              selected = next(item for item in entries if item['vers'] == version)
              row['registry'] = {key: selected.get(key) for key in ('vers', 'cksum', 'yanked', 'pubtime', 'rust_version')}
              row['declared_normal_dependencies'] = [item for item in selected['deps'] if item['kind'] == 'normal']
              (work / 'registry.json').write_text(json.dumps(selected, indent=2))
              env = os.environ.copy()
              env.update(CARGO_BUILD_JOBS='2', CARGO_TARGET_DIR=str(root / 'target'), CARGO_TERM_COLOR='never')
              metadata = subprocess.run(['cargo', 'metadata', '--format-version', '1'], cwd=work, env=env, text=True, capture_output=True, timeout=360)
              row['metadata_exit'] = metadata.returncode
              (work / 'metadata.stderr').write_text(metadata.stderr)
              if metadata.returncode == 0:
                  (work / 'metadata.json').write_text(metadata.stdout)
                  graph = json.loads(metadata.stdout)
                  by_id = {p['id']: p for p in graph['packages']}
                  interesting = {'crypto-bigint', 'rsa', 'p256', 'p384', 'ecdsa', 'openssl', 'openssl-sys', 'aws-lc-rs', 'aws-lc-sys', 'crypto-glue', 'getrandom'}
                  row['selected_crypto_packages'] = [{'name': p['name'], 'version': p['version'], 'source': p['source']} for p in graph['packages'] if p['name'] in interesting]
                  package = next(p for p in graph['packages'] if p['name'] == name and p['version'] == version)
                  package_root = pathlib.Path(package['manifest_path']).parent
                  row['source_runtime_references'] = []
                  for source in package_root.glob('src/**/*.rs'):
                      for line_number, line in enumerate(source.read_text().splitlines(), 1):
                          if any(needle in line for needle in ('SystemTime', 'Instant::now', 'std::thread', 'std::fs::', 'Uuid', 'user_handle', 'pub struct MobileSecurityObject', 'pub enum Handover')):
                              row['source_runtime_references'].append(f'{source.relative_to(package_root)}:{line_number}: {line.strip()}')
                  for label, target in [('native', None), ('wasm', 'wasm32-unknown-unknown')]:
                      cmd = ['cargo', 'check', '--locked', '--lib']
                      if target:
                          cmd += ['--target', target]
                      with (work / (label + '.log')).open('w') as log:
                          try:
                              proc = subprocess.run(cmd, cwd=work, env=env, stdout=log, stderr=subprocess.STDOUT, timeout=360)
                              row[label + '_exit'] = proc.returncode
                          except subprocess.TimeoutExpired:
                              row[label + '_exit'] = 'timeout'
                      lines = (work / (label + '.log')).read_text().splitlines()
                      row[label + '_log_tail'] = lines[-55:]
              else:
                  row['metadata_error'] = metadata.stderr[-6000:]
              results.append(row)
              (root / 'summary.json').write_text(json.dumps(results, indent=2))
              print('CANDIDATE_RESULT_BEGIN', flush=True)
              print(json.dumps(row, indent=2), flush=True)
              print('CANDIDATE_RESULT_END', flush=True)
          print('PROBE_SUMMARY_BEGIN')
          print(json.dumps([{k: row.get(k) for k in ('package', 'version', 'metadata_exit', 'native_exit', 'wasm_exit', 'selected_crypto_packages')} for row in results], indent=2))
          print('PROBE_SUMMARY_END')
          PY
          python3 "$RUNNER_TEMP/credential-probes/probe.py"
