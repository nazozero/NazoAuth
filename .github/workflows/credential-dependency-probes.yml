name: credential-dependency-probes

on:
  push:
    branches: [audit/credential-dependencies-20261117]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71
        with:
          targets: wasm32-unknown-unknown
      - name: Check age-eligible official packages and published contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/credential-contracts"
          cat > "$RUNNER_TEMP/credential-contracts/probe.py" <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'credential-contracts'
          cases = [('affinidi-mdoc', '0.6.0', ['es256']), ('webauthn-rs-core', '0.6.2', []), ('passki', '0.5.0', ['rust-crypto'])]
          results = []
          for name, version, features in cases:
              work = root / name
              (work / 'src').mkdir(parents=True)
              (work / '.cargo').mkdir()
              manifest = '[package]\nname = "candidate-contract-probe"\nversion = "0.0.0"\nedition = "2024"\n[workspace]\n[dependencies]\n'
              manifest += f'candidate = {{ package = "{name}", version = "={version}", default-features = false, features = {json.dumps(features)} }}\n'
              if name == 'webauthn-rs-core':
                  manifest += 'serde_cbor_2 = "=0.13.0"\nhex = "0.4"\n'
              manifest += '\n[target.\'cfg(target_arch = "wasm32")\'.dependencies]\ngetrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }\ngetrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }\ngetrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }\nuuid = { version = "1", features = ["js"] }\n'
              (work / 'Cargo.toml').write_text(manifest)
              (work / '.cargo/config.toml').write_text('[registry]\nglobal-min-publish-age = "3 days"\n[target.wasm32-unknown-unknown]\nrustflags = [\'--cfg\', \'getrandom_backend="wasm_js"\']\n')
              source = 'pub fn probe() {}\n'
              if name == 'webauthn-rs-core':
                  source += '''
          #[cfg(test)]
          mod tests {
              use candidate::{error::WebauthnError, proto::COSEKey};
              fn decode(value: &str) -> serde_cbor_2::Value {
                  serde_cbor_2::from_slice(&hex::decode(value).unwrap()).unwrap()
              }
              #[test]
              fn es256_positive_control() {
                  let value = decode("a501020326200121582065eda5a12577c2bae829437fe338701a10aaa375e1bb5b5de108de439c08551d2258201e52ed75701163f7f9e40ddf9f341b3dc9ba860af7e0ca7ca7e9eecd0084d19c");
                  assert!(COSEKey::try_from(&value).is_ok());
              }
              #[test]
              fn ed25519_contract_is_not_supported() {
                  let value = decode("a401010327200621582043565027f918beb00257d112b903d15b93f5cbc7562dfc8458fbefd714546e3c");
                  assert!(matches!(COSEKey::try_from(&value), Err(WebauthnError::SshPublicKeyEDUnsupported)));
              }
          }
          '''
              (work / 'src/lib.rs').write_text(source)
              row = {'package': name, 'version': version, 'features': features}
              request = urllib.request.Request('https://index.crates.io/' + name[:2] + '/' + name[2:4] + '/' + name, headers={'User-Agent': 'NazoAuth dependency audit'})
              index = [json.loads(line) for line in urllib.request.urlopen(request, timeout=30).read().decode().splitlines()]
              row['registry'] = next(entry for entry in index if entry['vers'] == version)
              env = dict(os.environ, CARGO_BUILD_JOBS='2', CARGO_TARGET_DIR=str(root / 'target'), CARGO_TERM_COLOR='never')
              metadata = subprocess.run(['cargo', 'metadata', '--format-version', '1'], cwd=work, env=env, text=True, capture_output=True, timeout=240)
              (work / 'metadata.stderr').write_text(metadata.stderr)
              row['metadata_exit'] = metadata.returncode
              if metadata.returncode == 0:
                  (work / 'metadata.json').write_text(metadata.stdout)
                  graph = json.loads(metadata.stdout)
                  package = next(p for p in graph['packages'] if p['name'] == name and p['version'] == version)
                  src = pathlib.Path(package['manifest_path']).parent
                  checks = [('native', ['cargo', 'test', '--locked', '--lib']) if name == 'webauthn-rs-core' else ('native', ['cargo', 'check', '--locked', '--lib']), ('wasm_compile', ['cargo', 'check', '--locked', '--lib', '--target', 'wasm32-unknown-unknown'])]
                  for label, command in checks:
                      with (work / (label + '.log')).open('w') as log:
                          try:
                              proc = subprocess.run(command, cwd=work, env=env, stdout=log, stderr=subprocess.STDOUT, timeout=360)
                              row[label + '_exit'] = proc.returncode
                          except subprocess.TimeoutExpired:
                              row[label + '_exit'] = 'timeout'
                      row[label + '_tail'] = (work / (label + '.log')).read_text().splitlines()[-15:]
                  selected = {'crypto-bigint', 'p256', 'p384', 'rsa', 'openssl-sys', 'aws-lc-sys'}
                  row['crypto_packages'] = sorted((p['name'], p['version']) for p in graph['packages'] if p['name'] in selected)
                  contexts = []
                  needles = {'affinidi-mdoc': ['pub struct MobileSecurityObject', 'pub struct SessionTranscript', 'pub enum Handover'], 'webauthn-rs-core': ['COSEKeyType::EC_OKP(_edk)', 'SshPublicKeyEDUnsupported'], 'passki': ['pub struct AuthenticationResult', 'SystemTime::now()']}
                  for path in src.glob('src/**/*.rs'):
                      lines = path.read_text().splitlines()
                      for number, line in enumerate(lines):
                          if any(needle in line for needle in needles[name]):
                              contexts.append({'file': str(path.relative_to(src)), 'line': number + 1, 'source_sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'excerpt': '\n'.join(lines[max(0, number-3):number+42])})
                  row['published_source_contexts'] = contexts
              else:
                  row['metadata_error'] = metadata.stderr
              results.append(row)
              (root / 'summary.json').write_text(json.dumps(results, indent=2))
              brief = {k: v for k, v in row.items() if k != 'registry'}
              brief['registry'] = {k: row['registry'].get(k) for k in ('vers', 'pubtime', 'yanked', 'cksum')}
              print(json.dumps(brief, indent=2), flush=True)
          shutil.rmtree(root / 'target', ignore_errors=True)
          PY
          python3 "$RUNNER_TEMP/credential-contracts/probe.py"
      - name: Retain exact manifests, locks, tests and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: credential-contract-probes
          path: ${{ runner.temp }}/credential-contracts
          retention-days: 30
