name: release-security

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  NAZOAUTH_IMAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'candidate' }}

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.0"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require successful governed CI for release inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash .github/scripts/release/check-inputs.sh verify-ci
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
      - name: Validate immutable release input
        shell: bash
        run: bash .github/scripts/release/check-inputs.sh validate-version
      - name: Validate Release workflow and predicate contracts
        run: python3 -m unittest tests.unit.test_release_attestation tests.unit.test_release_governance
          tests.unit.test_release_ci tests.unit.test_release_oci
      - name: Install pinned Rust supply-chain tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: |
            cargo-deny@0.20.2
            cargo-cyclonedx@0.5.9
      - name: Check dependency policy
        run: cargo deny check advisories bans licenses sources
      - name: Generate internal Rust SBOM evidence
        shell: bash
        run: >-
          cargo cyclonedx --manifest-path crates/server/Cargo.toml --format json --override-filename nazoauth.cdx &&
          mkdir -p target/release-evidence/sbom &&
          mv crates/server/nazoauth.cdx.json target/release-evidence/sbom/nazoauth.cdx.json
      - name: Upload internal supply-chain evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-supply-chain-evidence
          path: |
            target/release-evidence/sbom
            target/release-evidence/frontend
          if-no-files-found: error
          retention-days: 30

  operator-protocol-package:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
      - name: Package the unique operator protocol source
        shell: bash
        run: bash .github/scripts/release/assets.sh package-protocol
      - name: Upload immutable operator protocol package input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-operator-protocol-package
          path: target/release-protocol
          if-no-files-found: error
          retention-days: 30

  platform-binaries:
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
            libc: gnu
          - runner: ubuntu-24.04-arm
            os: linux
            target: aarch64-unknown-linux-gnu
            executable_suffix: ""
            libc: gnu
          - runner: ubuntu-24.04
            os: linux
            target: x86_64-unknown-linux-musl
            executable_suffix: ""
            libc: musl
          - runner: ubuntu-24.04-arm
            os: linux
            target: aarch64-unknown-linux-musl
            executable_suffix: ""
            libc: musl
          - runner: windows-2025
            os: windows
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe
            libc: msvc
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - runner: windows-11-arm
            os: windows
            target: aarch64-pc-windows-msvc
            executable_suffix: .exe
            libc: msvc
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
          - runner: macos-15-intel
            os: macos
            target: x86_64-apple-darwin
            executable_suffix: ""
            libc: darwin
          - runner: macos-15
            os: macos
            target: aarch64-apple-darwin
            executable_suffix: ""
            libc: darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
      RELEASE_LIBC: ${{ matrix.libc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}
      - name: Install Linux native build prerequisites
        if: matrix.os == 'linux'
        shell: bash
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends cmake make musl-tools perl
      - name: Bind musl builds to the native musl compiler
        if: matrix.libc == 'musl'
        shell: bash
        run: bash .github/scripts/release/platform.sh bind-musl
      - name: Verify macOS native build prerequisites
        if: matrix.os == 'macos'
        shell: bash
        run: >-
          cmake --version &&
          make --version &&
          perl -v >/dev/null
      - name: Verify Windows native build prerequisites
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          MSVC_COMPONENT: ${{ matrix.msvc_component }}
        run: ./.github/scripts/release/platform.ps1 check-msvc
      - name: Build the server binary once for this platform
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          --package nazo-server --bin nazoauth
      - name: Smoke the server binary and verify release identity
        shell: pwsh
        run: ./.github/scripts/release/platform.ps1 smoke
      - name: Verify Linux single-file native dependency boundary
        if: matrix.os == 'linux'
        shell: bash
        run: bash .github/scripts/release/platform.sh check-linux
      - name: Verify macOS single-file native dependency boundary
        if: matrix.os == 'macos'
        shell: bash
        run: bash .github/scripts/release/platform.sh check-macos
      - name: Verify Windows single-file native dependency boundary
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./.github/scripts/release/platform.ps1 check-windows
      - name: Stage platform-suffixed binaries
        shell: pwsh
        run: ./.github/scripts/release/platform.ps1 stage
      - name: Upload platform binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries-${{ matrix.target }}
          path: target/release-binaries
          if-no-files-found: error
          retention-days: 7

  container-image:
    needs: platform-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      index_digest: ${{ steps.descriptor.outputs.index_digest }}
      amd64_digest: ${{ steps.descriptor.outputs.amd64_digest }}
      arm64_digest: ${{ steps.descriptor.outputs.arm64_digest }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.0"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download native amd64 Release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries-x86_64-unknown-linux-gnu
          path: target/release-container/source-amd64
      - name: Download native arm64 Release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries-aarch64-unknown-linux-gnu
          path: target/release-container/source-arm64
      - name: Stage the exact native application binaries for OCI assembly
        shell: bash
        run: bash .github/scripts/release/oci.sh stage-binaries
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install OCI inspection tools
        shell: bash
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends jq skopeo
      - name: Build exact multi-platform OCI archive
        id: oci
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile.release
          no-cache-filters: runtime
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/nazoauth-image.oci.tar,name=ghcr.io/nazozero/nazoauth:${{ env.NAZOAUTH_IMAGE_VERSION }},oci-artifact=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=nazoauth-release-oci
          cache-to: type=gha,mode=max,scope=nazoauth-release-oci
          labels: |
            org.opencontainers.image.version=${{ env.NAZOAUTH_IMAGE_VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Scan the exact OCI archive before publication
        shell: bash
        env:
          EXPECTED_INDEX_DIGEST: ${{ steps.oci.outputs.digest }}
          TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
        run: bash .github/scripts/release/oci.sh scan
      - name: Record the closed OCI descriptor
        id: descriptor
        shell: bash
        env:
          EXPECTED_INDEX_DIGEST: ${{ steps.oci.outputs.digest }}
        run: bash .github/scripts/release/oci.sh record-descriptor
      - name: Upload OCI descriptor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-oci-descriptor
          path: target/release-evidence/oci/descriptor.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload exact scanned OCI archive as internal evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-oci-evidence
          path: ${{ runner.temp }}/nazoauth-image.oci.tar
          if-no-files-found: error
          retention-days: 7

  attest-platform-binaries:
    if: github.ref_type == 'tag'
    needs: [platform-binaries, container-image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - target: aarch64-unknown-linux-gnu
            executable_suffix: ""
          - target: x86_64-unknown-linux-musl
            executable_suffix: ""
          - target: aarch64-unknown-linux-musl
            executable_suffix: ""
          - target: x86_64-pc-windows-msvc
            executable_suffix: .exe
          - target: aarch64-pc-windows-msvc
            executable_suffix: .exe
          - target: x86_64-apple-darwin
            executable_suffix: ""
          - target: aarch64-apple-darwin
            executable_suffix: ""
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.0"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download platform binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries-${{ matrix.target }}
          path: target/release-binaries
      - name: Download OCI descriptor
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-oci-descriptor
          path: target/release-evidence/oci
      - name: Build the closed ReleaseManifest predicate
        shell: bash
        run: >-
          python3 scripts/build_release_attestation.py
          --version "$GITHUB_REF_NAME"
          --target "${{ matrix.target }}"
          --binary "target/release-binaries/nazoauth-${{ matrix.target }}${{ matrix.executable_suffix }}"
          --oci target/release-evidence/oci/descriptor.json
          --output "target/release-evidence/release-manifest-${{ matrix.target }}.json"
      - name: Attest nazoauth ReleaseManifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-binaries/nazoauth-${{ matrix.target }}${{ matrix.executable_suffix }}
          predicate-type: https://nazo.run/attestations/release-manifest/v1
          predicate-path: target/release-evidence/release-manifest-${{ matrix.target }}.json
      - name: Attest standard binary build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release-binaries/nazoauth-${{ matrix.target }}${{ matrix.executable_suffix }}
      - name: Upload platform attestation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-attestation-${{ matrix.target }}
          path: target/release-evidence
          if-no-files-found: error
          retention-days: 30

  attest-operator-protocol:
    if: github.ref_type == 'tag'
    needs: operator-protocol-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/release
      - name: Download the exact packaged protocol crate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-operator-protocol-package
          path: target/release-protocol
      - name: Verify the protocol package name and digest record
        id: protocol_package
        shell: bash
        run: bash .github/scripts/release/assets.sh verify-protocol
      - name: Attest operator protocol package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.protocol_package.outputs.path }}

  publish-container:
    if: github.ref_type == 'tag'
    needs: [attest-platform-binaries, container-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/release
      - name: Download the exact scanned OCI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-oci-evidence
          path: target/release-evidence/oci
      - name: Download the closed OCI descriptor
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-oci-descriptor
          path: target/release-evidence/oci
      - name: Install OCI publication tools
        shell: bash
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends jq skopeo
      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the exact scanned OCI index without rebuilding
        shell: bash
        env:
          EXPECTED_INDEX_DIGEST: ${{ needs.container-image.outputs.index_digest }}
        run: bash .github/scripts/release/oci.sh publish
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3
      - name: Sign the published OCI index by digest
        shell: bash
        run: cosign sign --yes ghcr.io/nazozero/nazoauth@${{ needs.container-image.outputs.index_digest }}
      - name: Attest published OCI provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/nazozero/nazoauth
          subject-digest: ${{ needs.container-image.outputs.index_digest }}
          push-to-registry: true

  publish-release:
    if: github.ref_type == 'tag'
    needs: [attest-platform-binaries, attest-operator-protocol, publish-container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/release
      - name: Download every attested platform binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-binaries-*
          path: target/release-binaries
          merge-multiple: true
      - name: Download the attested operator protocol package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-operator-protocol-package
          path: target/release-protocol
      - name: Publish immutable server and protocol GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release/assets.sh publish
