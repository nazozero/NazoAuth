name: Jiff continuation candidate

on:
  push:
    branches: [audit/passkey-resume-20261118]
    paths: [.audit/continue-jiff.py, .audit/jiff-fixes.py, '.audit/jiff-corrections/**', .github/workflows/jiff-continuation.yml]

concurrency:
  group: jiff-continuation-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: '1.100.0'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: audit
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: validation/jiff-continuation-20261118
          path: nazo
          persist-credentials: true
          show-progress: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 652507a91af36284a52b024db5bb0a573ed90967
          path: independent
          persist-credentials: false
          sparse-checkout: crates/server/tests/unit/domain/passkey/profile.rs
          sparse-checkout-cone-mode: false
          show-progress: false
      - name: Install the pinned compiler
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: nazo -> target
          key: jiff-continuation-v2
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Apply the migration and reviewed semantic corrections
        run: |
          set -euo pipefail
          python3 audit/.audit/continue-jiff.py nazo independent
          if test -f audit/.audit/jiff-fixes.py; then python3 audit/.audit/jiff-fixes.py nazo; fi
          for correction in audit/.audit/jiff-corrections/*.py; do
            test -f "$correction" || continue
            python3 "$correction" nazo
          done
          cd nazo
          cargo fmt --all
      - name: Compile and enforce warnings-denied Clippy
        id: compile
        working-directory: nazo
        shell: bash
        run: |
          set +e
          mkdir -p ../evidence
          rustc -Vv > ../evidence/compiler.txt
          cargo check --locked --workspace --all-targets --all-features --keep-going --message-format=json > ../evidence/check.jsonl 2> ../evidence/check.stderr
          result=$?
          echo "$result" > ../evidence/compile.exit
          printf '%s\n' 'cargo check --locked --workspace --all-targets --all-features --keep-going --message-format=json' > ../evidence/final-command.txt
          cp ../evidence/check.jsonl ../evidence/final.jsonl
          cp ../evidence/check.stderr ../evidence/final.stderr
          if test "$result" = 0; then
            # Apply compiler/linter machine-applicable cleanup only after type
            # checking, then validate the resulting source afresh with -D warnings.
            cargo clippy --fix --locked --workspace --all-targets --all-features --allow-dirty --allow-staged --keep-going > ../evidence/clippy-fix.log 2>&1
            echo $? > ../evidence/clippy-fix.exit
            cargo fmt --all > ../evidence/format.log 2>&1
            format_result=$?
            echo "$format_result" > ../evidence/format.exit
            cargo clippy --locked --workspace --all-targets --all-features --keep-going --message-format=json -- -D warnings > ../evidence/final.jsonl 2> ../evidence/final.stderr
            result=$?
            echo "$result" > ../evidence/clippy.exit
            printf '%s\n' 'cargo clippy --locked --workspace --all-targets --all-features --keep-going --message-format=json -- -D warnings' > ../evidence/final-command.txt
            if test "$format_result" != 0; then result="$format_result"; fi
          fi
          echo "$result" > ../evidence/check.exit
          echo "exit=$result" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          errors, warnings = [], []
          seen = set()
          for line in Path('../evidence/final.jsonl').read_text().splitlines():
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if item.get('reason') != 'compiler-message':
                  continue
              message = item['message']
              summary = {
                  'code': (message.get('code') or {}).get('code'),
                  'message': message['message'],
                  'rendered': message.get('rendered'),
                  'sites': [
                      {'file': s['file_name'], 'line': s['line_start'], 'text': s['text'], 'label': s['label']}
                      for s in message.get('spans', []) if s['is_primary']
                  ],
              }
              key = (summary['message'], tuple((s['file'], s['line']) for s in summary['sites']))
              if key in seen:
                  continue
              seen.add(key)
              (errors if message['level'] == 'error' else warnings).append(summary)
          Path('../evidence/errors.json').write_text(json.dumps(errors, indent=2) + '\n')
          Path('../evidence/warnings.json').write_text(json.dumps(warnings, indent=2) + '\n')
          Path('../evidence/errors-full.txt').write_text('\n'.join(e.get('rendered') or e['message'] for e in errors))
          compact = []
          for error in errors:
              compact.append(f"{error['code']}: {error['message']}")
              for site in error['sites']:
                  compact.append(f"  {site['file']}:{site['line']}: {site['label'] or ''}")
                  for line in site['text']:
                      compact.append('    ' + line['text'])
              compact.append('')
          Path('../evidence/errors.txt').write_text('\n'.join(compact))
          print(f'UNIQUE DIAGNOSTICS: {len(errors)} errors; {len(warnings)} other messages')
          print('\n'.join(compact)[:50000])
          print('\n'.join(Path('../evidence/final.stderr').read_text().splitlines()[-20:]))
          PY
      - name: Preserve candidate source and exact validation status
        if: always() && steps.compile.outcome != 'skipped'
        working-directory: nazo
        shell: bash
        run: |
          set -euo pipefail
          test -f ../evidence/check.exit
          mkdir -p .verification
          git add -A -- ':!.verification'
          source_tree=$(git write-tree)
          SOURCE_TREE="$source_tree" python3 - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          result = {
              'status': 'PASS' if Path('../evidence/check.exit').read_text().strip() == '0' else 'FAIL',
              'command': Path('../evidence/final-command.txt').read_text().strip(),
              'phase_exits': {p.stem: int(p.read_text()) for p in Path('../evidence').glob('*.exit')},
              'parent': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_tree_before_evidence': os.environ['SOURCE_TREE'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'errors': json.loads(Path('../evidence/errors.json').read_text()),
              'stderr_tail': '\n'.join(Path('../evidence/final.stderr').read_text().splitlines()[-30:]),
          }
          Path('.verification/jiff-check.json').write_text(json.dumps(result, indent=2) + '\n')
          shutil.copyfile('../evidence/errors.txt', '.verification/jiff-check.txt')
          shutil.copyfile('../evidence/warnings.json', '.verification/jiff-warnings.json')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(time): validate native Jiff conversion with explicit compile and lint status'
            git push origin HEAD:refs/heads/validation/jiff-continuation-20261118
          fi
          git rev-parse HEAD HEAD^{tree} > ../evidence/candidate-identity.txt
          cat ../evidence/candidate-identity.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: jiff-continuation-diagnostics
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Enforce the validation result
        if: always() && steps.compile.outcome != 'skipped'
        run: exit "$(cat evidence/check.exit)"
