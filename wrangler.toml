name = "nazoauth"
main = "crates/server-worker/build/worker/shim.mjs"
compatibility_date = "2026-11-19"
workers_dev = false
# Set your public zone route/custom domain after configuring the ingress rule.
# routes = [{ pattern = "auth.example.com", custom_domain = true }]

[version_metadata]
binding = "NAZO_VERSION"

[triggers]
crons = ["* * * * *"]

[build]
command = "cd crates/server-worker && worker-build --release --locked"

[observability]
enabled = true

# Deploy button provisions NAZO_DB. Worker remains unpublished to a public route
# until the operator provisions credentials, configures a domain and installs WAF.
# Never put secrets in vars.
[[d1_databases]]
binding = "NAZO_DB"
database_name = "nazoauth"
migrations_dir = "crates/authorization-server-d1/migrations"

[vars]
NAZO_CONFIG = '''{"tenant":{"tenant_id":"00000000-0000-0000-0000-000000000001","realm_id":"00000000-0000-0000-0000-000000000002","organization_id":"00000000-0000-0000-0000-000000000003"},"issuer":"https://auth.example.com","frontend_base_url":"https://app.example.com","ingress":"direct_cloudflare","cors_allowed_origins":["https://app.example.com"],"modules":[],"machine_only":true}'''
NAZO_SIGNING_KEY_ID = "primary"
