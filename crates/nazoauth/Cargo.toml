[package]
name = "nazoauth"
description = "Framework-neutral OAuth 2.0 and OpenID Connect server library for Rust hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["deployment-control"]
# Independent native controller identity, recovery and cross-tenant administration.
deployment-control = []
# Focused native regression tests only; adapters use the public facade.
test-support = ["deployment-control"]
conformance = []

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
cookie = { workspace = true, features = ["percent-encode"] }
encoding_rs.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
http.workspace = true
jiff.workspace = true
matchit.workspace = true
mime.workspace = true
multer.workspace = true
nazo-auth.workspace = true
nazo-crypto = { workspace = true, features = ["jose", "password", "ed25519", "x509", "aead"] }
nazo-digital-credentials.workspace = true
nazo-http-signatures.workspace = true
nazo-identity.workspace = true
nazo-key-management.workspace = true
nazo-oauth-server.workspace = true
nazo-openid4vci.workspace = true
nazo-openid4vp.workspace = true
nazo-operator-protocol.workspace = true
nazo-passkey.workspace = true
nazo-persistence.workspace = true
nazo-resource-server.workspace = true
nazo-runtime-modules.workspace = true
nazo-scim-events.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true
uuid.workspace = true
web-time.workspace = true
zeroize.workspace = true

[dev-dependencies]
futures-executor.workspace = true
nazo-key-management = { workspace = true, features = ["test-support"] }
proptest.workspace = true
rcgen.workspace = true

[lints]
workspace = true
