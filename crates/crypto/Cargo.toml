[package]
name = "nazo-crypto"
description = "Cryptographic primitives and key operations for NazoAuth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
jose = [
    "dep:futures-channel",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:jsonwebtoken",
    "dep:aws-lc-rs",
    "dep:p256",
    "p256/pkcs8",
    "dep:ed25519-dalek",
    "ed25519-dalek/pkcs8",
    "dep:pkcs8",
    "dep:base64",
    "dep:rand",
    "dep:rsa",
    "dep:aes-kw",
    "dep:sha2",
    "dep:serde",
    "dep:serde_json",
]
ecdh = ["dep:p256", "p256/ecdh", "dep:zeroize", "dep:base64", "dep:serde"]
aead = ["dep:aes-gcm"]
password = ["dep:argon2"]
ed25519 = ["dep:ed25519-dalek"]
x509 = [
    "dep:rustls-pki-types", "dep:webpki", "dep:x509-parser",
    "dep:p256", "dep:p384", "dep:p521", "dep:rsa", "dep:sha1", "dep:sha2",
    "dep:ed25519-dalek", "dep:ml-dsa",
]
# Local CA/CRL provisioning is owned by the native host's keyctl composition.
certificate-issuance = ["x509", "dep:rcgen"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
pkcs8 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, features = ["oid"], optional = true }
thiserror.workspace = true
webpki = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
aws-lc-rs = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true, features = ["aws_lc_rs"] }
rcgen = { workspace = true, optional = true }
webpki = { workspace = true, optional = true, features = ["aws-lc-rs"] }
x509-parser = { workspace = true, optional = true, features = ["verify-aws"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
aes-kw = { version = "0.3.1", optional = true, features = ["zeroize"] }
futures-channel = { workspace = true, optional = true }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
js-sys = { version = "0.3.107", optional = true }
jsonwebtoken = { workspace = true, optional = true, features = ["rust_crypto"] }
ml-dsa = { workspace = true, optional = true }
p384 = { workspace = true, optional = true }
p521 = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
sha1 = { workspace = true, features = ["oid"], optional = true }
wasm-bindgen = { version = "0.2.130", optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
aws-lc-rs.workspace = true
der.workspace = true
ml-dsa.workspace = true
p384.workspace = true
p521.workspace = true
rcgen.workspace = true
rsa.workspace = true
rustls.workspace = true
sha1 = { workspace = true, features = ["oid"] }
sha2 = { workspace = true, features = ["oid"] }
x509-cert.workspace = true

[lints]
workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test.workspace = true
