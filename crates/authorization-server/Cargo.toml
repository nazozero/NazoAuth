[package]
name = "nazo-oauth-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
ciborium.workspace = true
coset.workspace = true
flate2.workspace = true
futures-util.workspace = true
hmac.workspace = true
http.workspace = true
jiff.workspace = true
nazo-auth.workspace = true
nazo-crypto = { workspace = true, features = ["jose", "ecdh", "aead", "x509"] }
nazo-digital-credentials.workspace = true
nazo-http-signatures.workspace = true
nazo-identity.workspace = true
nazo-key-management.workspace = true
nazo-mdoc = { workspace = true, features = ["issue"] }
nazo-openid4vci.workspace = true
nazo-openid4vp.workspace = true
nazo-operator-protocol.workspace = true
nazo-passkey.workspace = true
nazo-persistence.workspace = true
nazo-resource-server.workspace = true
nazo-runtime-modules.workspace = true
nazo-scim-events.workspace = true
rand.workspace = true
rustls-pki-types.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }
x509-parser.workspace = true

[lints]
workspace = true

[dev-dependencies]
futures-executor.workspace = true
jsonwebtoken.workspace = true
nazo-key-management = { workspace = true, features = ["test-support"] }
p256 = { workspace = true, features = ["ecdh", "ecdsa", "pkcs8"] }
time.workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
aws-lc-rs.workspace = true
nazo-crypto = { workspace = true, features = ["certificate-issuance"] }
rcgen.workspace = true
sha1.workspace = true
yasna.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
nazo-mdoc = { workspace = true, features = ["wasm-js"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test.workspace = true
