[package]
name = "nazo-server-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[features]
provisioning = ["nazo-oauth-server-d1/local-sqlite", "dep:futures-executor"]

[[bin]]
name = "nazo-worker-provision"
path = "src/bin/provision.rs"
required-features = ["provisioning"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
futures-executor = { workspace = true, optional = true }
http.workspace = true
jiff.workspace = true
nazoauth.workspace = true
nazo-auth.workspace = true
nazo-crypto = { workspace = true, features = ["password"] }
nazo-digital-credentials.workspace = true
nazo-identity.workspace = true
nazo-key-management.workspace = true
nazo-oauth-server.workspace = true
nazo-oauth-server-d1.workspace = true
nazo-runtime-modules.workspace = true
nazo-scim-events.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
zeroize.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
http-body-util.workspace = true
nazo-http-worker.workspace = true
worker = { workspace = true, features = ["http", "d1"] }

[dev-dependencies]
futures-executor.workspace = true

[lints]
workspace = true
