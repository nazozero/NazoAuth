<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>NazoAuth · 应用授权</title>
<main>
<h1>应用授权</h1>
<p id="status" role="status">正在读取授权请求…</p>
<section id="details" hidden>
<p>请求应用 <strong id="client"></strong></p>
<p>回调地址 <code id="redirect"></code></p>
<p>请求的权限和信息</p>
<ul id="permissions"></ul>
<form method="post" action="/authorize/decision">
<input name="request_id" type="hidden">
<input name="csrf_token" type="hidden">
<button name="decision" value="approve">允许</button>
<button name="decision" value="deny">拒绝</button>
</form>
</section>
</main>
<script src="/consent.js" defer></script>
</html>
