[package]
name = "nazo-key-management"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []

[dependencies]
arc-swap.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
nazo-auth.workspace = true
nazo-crypto = { workspace = true, features = ["jose", "ecdh", "aead"] }
nazo-digital-credentials.workspace = true
pem.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }
x509-cert.workspace = true
x509-parser.workspace = true

[lints]
workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
der.workspace = true
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }
tokio = { workspace = true, features = ["macros", "rt"] }
futures-executor.workspace = true
rcgen.workspace = true
time.workspace = true
