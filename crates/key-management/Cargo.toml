[package]
name = "nazo-key-management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []
worker-signing = ["dep:futures-channel", "dep:js-sys", "dep:pkcs8", "dep:wasm-bindgen"]

[dependencies]
web-time.workspace = true
hex.workspace = true
arc-swap.workspace = true
anyhow.workspace = true
base64.workspace = true
jiff.workspace = true
nazo-auth.workspace = true
nazo-crypto = { workspace = true, features = ["jose", "ecdh", "aead", "ed25519", "x509"] }
nazo-digital-credentials.workspace = true
nazo-mdoc = { workspace = true, features = ["certificate-profile"] }
pem.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }
x509-cert.workspace = true
x509-parser.workspace = true

[lints]
workspace = true

[dev-dependencies]
der.workspace = true
jsonwebtoken.workspace = true
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }
tokio = { workspace = true, features = ["macros", "rt"] }
futures-executor.workspace = true
time.workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
aws-lc-rs.workspace = true
rcgen.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
futures-channel = { workspace = true, optional = true }
js-sys = { version = "0.3.107", optional = true }
pkcs8 = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2.130", optional = true }
