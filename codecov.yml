coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
      security_core:
        target: auto
        threshold: 2%
        paths:
          - "crates/authorization-server-core/src/"
          - "crates/authorization-server/src/"
          - "crates/http-actix/src/"
          - "crates/nazoauth/src/http/"
          - "crates/nazoauth/src/adapters/security/"
          - "crates/resource-server/src/"
          - "crates/key-management/src/"
          - "crates/persistence-postgres/src/repositories/"
          - "crates/state-store-valkey/src/"
    patch:
      default:
        target: 90%
        threshold: 2%

ignore:
  # Generated Diesel declarations; executable repository code remains measured.
  - "crates/persistence-postgres/src/schema.rs"
  - "**/cargo/registry/**"
  - "tests/**"
  - "crates/**/tests/**"
  - "benches/**"
  - "examples/**"
  - "migrations/**"
